<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifique seu Email • EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      max-width: 500px; width: 100%; padding: 38px 30px; text-align: center; }
    .logo { margin-bottom: 28px; font-size: 48px; }
    h1 { color: var(--marca); margin-bottom: 18px; font-size: 24px; font-weight: 700; }
    .auth-status { margin: 28px 0; font-size: 16px; line-height: 1.6; color: var(--tinta); }
    .auth-email { background: var(--surface-alt); padding: 15px; border-radius: var(--radius-sm);
      font-weight: 600; color: var(--marca); margin: 20px 0; border-left: 4px solid var(--marca); }
    .auth-status-text { color: var(--tinta-2); margin: 15px 0; }
    .auth-botoes { margin-top: 28px; display: flex; gap: 10px; flex-direction: column; }
    .auth-btn-primary { padding: 12px 20px; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all .3s;
      background: var(--marca); color: white; }
    .auth-btn-primary:hover:not(:disabled) { background: var(--marca-escura); }
    .auth-btn-primary:disabled { opacity: .6; cursor: wait; }
    .auth-btn-secondary { padding: 12px 20px; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all .3s;
      background: transparent; color: var(--marca); border: 2px solid var(--marca); }
    .auth-btn-secondary:hover { background: var(--marca); color: white; }
    .auth-msg { margin-top: 15px; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; display: none; }
    .auth-msg.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; }
    .auth-msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; display: block; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--tinta-3); }
    .auth-footer a { color: var(--marca); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">📧</div>
    <h1>Verifique seu Email</h1>

    <div class="auth-status">
      <p>Enviamos um link de confirmação para:</p>
      <div class="auth-email" id="emailDisplay"></div>
      <p class="auth-status-text">Clique no link no seu email para ativar sua conta.</p>
    </div>

    <div class="auth-botoes">
      <button class="auth-btn-primary" id="btnReenviar" onclick="reenviarVerificacao()">
        📬 Reenviar Email
      </button>
      <button class="auth-btn-secondary" onclick="window.location.href='/login.html'">
        Já verifiquei, ir para login
      </button>
    </div>

    <div id="mensagem" class="auth-msg"></div>

    <div class="auth-footer" style="margin-top: 40px;">
      <p>Não recebeu? <a href="/solicitar-verificacao.html">Use outro email</a></p>
    </div>
  </div>

  <script>
    function obterEmailDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('email') || '';
    }

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `auth-msg ${tipo}`;
    }

    async function reenviarVerificacao() {
      const email = obterEmailDaUrl();
      if (!email) {
        mostrarMensagem('Email não encontrado na URL', 'error');
        return;
      }

      const btn = document.getElementById('btnReenviar');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const resp = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await resp.json();
        if (resp.ok) {
          mostrarMensagem('✓ Email reenviado com sucesso! Verifique sua caixa de entrada.', 'success');
        } else {
          mostrarMensagem(data.erro || 'Erro ao reenviar email', 'error');
        }
      } catch (e) {
        mostrarMensagem('Erro ao conectar com o servidor: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '📬 Reenviar Email';
      }
    }

    // Exibir email na página ao carregar
    window.addEventListener('DOMContentLoaded', () => {
      const email = obterEmailDaUrl();
      if (email) {
        document.getElementById('emailDisplay').textContent = email;
      } else {
        document.getElementById('emailDisplay').textContent = '(email não informado)';
        mostrarMensagem('Email não encontrado. Verifique a URL.', 'error');
      }
    });
  </script>
</body>
</html>
