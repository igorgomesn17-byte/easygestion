<DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatos do dia • EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    /* Cada contato é um card com a mensagem PRONTA e editável. A lojista lê,
       ajusta se quiser, e manda. Sem tela intermediária, sem copiar e colar. */
    .acao { border-left: 3px solid var(--linha-forte); }
    .acao.p1 { border-left-color: var(--vermelho); }   /* hoje, não deixa passar */
    .acao.p2 { border-left-color: var(--dourado); }
    .acao.p3 { border-left-color: var(--marca); }
    .acao-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
    .acao-quem { font-weight:700; font-size:1.02rem; color:var(--tinta); }
    .acao-por  { color:var(--tinta-2); font-size:0.85rem; margin-top:2px; }
    /* Valor da cliente: discreto, mas presente. Sem ele a lojista manda a mesma
       mensagem pra quem gastou R$3.000 e pra quem gastou R$49. */
    .acao-valor { color:var(--tinta-3,#8a9a92); font-size:0.78rem; margin-top:3px; font-variant-numeric:tabular-nums; }
    .acao-msg  { width:100%; min-height:104px; margin:12px 0 10px; resize:vertical;
                 font-family:inherit; font-size:0.88rem; line-height:1.5; }
    .acao-btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn-zap { background:#25D366; border-color:#25D366; color:#fff; }
    .btn-zap:hover { background:#1eb356; border-color:#1eb356; }
    .selo-seg { font-size:0.7rem; padding:2px 8px; border-radius:999px; font-weight:700; color:#fff; white-space:nowrap; }
    .filtros { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .pill { padding:6px 12px; border:1px solid var(--linha); border-radius:999px; background:var(--surface);
            cursor:pointer; font-size:0.84rem; font-weight:600; color:var(--tinta-2); }
    .pill.on { background:var(--marca); border-color:var(--marca); color:#fff; }
    .vazio { text-align:center; padding:56px 20px; color:var(--tinta-2); }
    .vazio-emoji { font-size:2.4rem; display:block; margin-bottom:10px; }
    /* O cupom fica FORA do textarea: se a lojista apagar o código do texto sem
       querer, ela precisa ver que ele existe (e o sistema avisa antes de enviar). */
    .chip-cupom { margin-top:12px; padding:8px 12px; background:var(--dourado-claro);
                  border-radius:var(--radius-sm); font-size:0.85rem; color:var(--dourado-escuro); }
    .chip-nota { display:block; font-size:0.75rem; opacity:.85; margin-top:2px; }
  </style>
</head>
<body>
  <div class="conteudo">
    <div class="flex-entre">
      <div>
        <h1>Contatos do dia</h1>
        <p class="subtitulo">Quem falar com hoje — a mensagem já vem pronta. Você lê, ajusta se quiser, e manda.</p>
      </div>
      <button class="btn btn-sec" onclick="gerar()">Atualizar lista</button>
    </div>

    <!-- Cadência semanal: nasce desligada de propósito. Ligar sem a lojista pedir
         mandaria mensagem toda semana pra base inteira — o caminho mais rápido
         pra virar spam. -->
    <div class="card" style="padding:14px 16px; margin-bottom:16px; display:flex;
                             align-items:center; gap:12px; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <strong style="font-size:0.92rem;">Novidades da semana</strong>
        <div class="texto-cinza" style="font-size:0.8rem; margin-top:2px;" id="cadTxt">—</div>
      </div>
      <select id="cadDia" onchange="salvarCadencia()" style="padding:7px 10px;
              border-radius:var(--radius-sm); border:1px solid var(--linha);">
        <option value="0">Desligado</option>
        <option value="1">Toda segunda</option>
        <option value="2">Toda terça</option>
        <option value="3">Toda quarta</option>
        <option value="4">Toda quinta</option>
        <option value="5">Toda sexta</option>
        <option value="6">Todo sábado</option>
        <option value="7">Todo domingo</option>
      </select>
    </div>

    <div id="filtros" class="filtros"></div>
    <div id="lista"></div>
  </div>

  <script src="js/comum.js"></script>
  <script>
    let ACOES = [], FILTRO = 'todas';
    // A loja conectou o WhatsApp? Muda o que o botão faz (mandar daqui × abrir o
    // wa.me) e o que ele diz. Vem do servidor a cada carregamento — se a instância
    // for desconectada, a tela volta sozinha pro comportamento antigo.
    let TEM_CANAL = false;

    // Cadência da semana. Falhar aqui não pode travar a fila — que é o que a
    // lojista veio ver.
    async function carregarCadencia() {
      try {
        const d = await api('/relacionamento/cadencia');
        document.getElementById('cadDia').value = String(d.dia || 0);
        pintarCadencia(d.dia || 0);
      } catch (e) { /* segue sem */ }
    }

    function pintarCadencia(dia) {
      const nomes = ['', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
      document.getElementById('cadTxt').textContent = dia
        ? `Toda ${nomes[dia]}, quem já comprou entra na fila com o convite do catálogo.`
        : 'Desligado. Ligue para avisar a base toda semana quando chegar coleção nova.';
    }

    async function salvarCadencia() {
      const dia = parseInt(document.getElementById('cadDia').value, 10);
      try {
        await api('/relacionamento/cadencia', { method: 'POST', body: { dia } });
        pintarCadencia(dia);
        toast(dia ? 'Cadência ligada' : 'Cadência desligada');
      } catch (e) { toast(e.message || 'Erro ao salvar', 'erro'); }
    }

    async function carregar() {
      carregarCadencia();
      try {
        const d = await api('/relacionamento/acoes');
        ACOES = d.acoes || [];
        TEM_CANAL = !!d.tem_canal;
        render();
      } catch (e) {
        document.getElementById('lista').innerHTML =
          `<div class="card vazio">Não consegui carregar os contatos. ${e.message || ''}</div>`;
      }
    }

    // Força a geração do dia (o agendador roda 06:00; isto é pra quando a lojista
    // quer ver AGORA, ou pra recuperar um dia em que o servidor esteve fora).
    async function gerar() {
      try {
        await api('/relacionamento/gerar', { method: 'POST' });
        await carregar();
        toast('Lista atualizada');
      } catch (e) { toast(e.message || 'Não deu pra atualizar', 'erro'); }
    }

    function render() {
      const tipos = {};
      ACOES.forEach(a => { tipos[a.label] = (tipos[a.label] || 0) + 1; });

      document.getElementById('filtros').innerHTML =
        [`<span class="pill ${FILTRO==='todas'?'on':''}" onclick="filtrar('todas')">Todas (${ACOES.length})</span>`]
        .concat(Object.entries(tipos).map(([l, n]) =>
          `<span class="pill ${FILTRO===l?'on':''}" onclick="filtrar(${JSON.stringify(l).replace(/"/g,'&quot;')})">${l} (${n})</span>`
        )).join('');

      const lista = FILTRO === 'todas' ? ACOES : ACOES.filter(a => a.label === FILTRO);
      const box = document.getElementById('lista');

      if (!lista.length) {
        box.innerHTML = `<div class="card vazio">
          <span class="vazio-emoji">☕</span>
          <strong>Nenhum contato pendente.</strong>
          <p style="margin-top:6px;">Quando alguém comprar, fizer aniversário ou sumir por um tempo, ela aparece aqui.</p>
        </div>`;
        return;
      }

      box.innerHTML = lista.map((a, i) => `
        <div class="card acao p${Math.min(a.prioridade, 3)}" id="acao-${a.id}">
          <div class="acao-topo">
            <div>
              <div class="acao-quem">${esc(a.nome)}</div>
              <div class="acao-por">${esc(a.label)} • ${esc(a.detalhe || '')}</div>
              ${a.num_compras > 0 ? `
                <div class="acao-valor">
                  ${moeda(a.total_gasto)} em ${a.num_compras} ${a.num_compras === 1 ? 'compra' : 'compras'}
                </div>` : ''}
            </div>
            ${a.segmento_nome ? `<span class="selo-seg" style="background:${a.segmento_cor}">${esc(a.segmento_nome)}</span>` : ''}
          </div>

          ${a.cupom ? `
            <div class="chip-cupom">
              🎟️ <strong>${esc(a.cupom)}</strong> · ${a.cupom_pct}% de desconto
              ${a.cupom_validade ? ` · vale até ${a.cupom_validade.split('-').reverse().join('/')}` : ''}
              <span class="chip-nota">só desta cliente — desconta sozinho no caixa</span>
            </div>` : ''}

          <textarea class="acao-msg" id="msg-${a.id}">${esc(a.mensagem)}</textarea>

          <div class="acao-btns">
            <button class="btn btn-zap" id="btn-env-${a.id}" onclick="enviar(${a.id})">${TEM_CANAL ? 'Enviar' : 'Enviar no WhatsApp'}</button>
            <button class="btn btn-sec" onclick="copiar(${a.id})">Copiar</button>
            <select class="sel-adiar" onchange="adiar(${a.id}, this.value); this.value='';"
                    style="padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--linha);">
              <option value="">Adiar…</option>
              <option value="1">amanhã</option>
              <option value="3">3 dias</option>
              <option value="7">1 semana</option>
            </select>
            <button class="btn btn-sec" onclick="ignorar(${a.id})" style="margin-left:auto;">Não contatar</button>
          </div>
        </div>
      `).join('');
    }

    function filtrar(l) { FILTRO = l; render(); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    // O texto pode ter sido editado no textarea: manda (e grava no histórico) o que
    // está na tela, não o que veio do banco.
    function textoDe(id) { return document.getElementById('msg-' + id).value; }

    async function enviar(id) {
      const a = ACOES.find(x => x.id === id);
      const msg = textoDe(id);

      // A mensagem é editável — e é fácil apagar o código sem perceber. O cupom
      // continua existindo (a verdade mora no banco, não no texto), mas a cliente
      // não vai saber dele: contato gasto, retorno zero.
      if (a.cupom && !msg.includes(a.cupom)) {
        if (!confirm(
          `Você tirou o cupom ${a.cupom} da mensagem.\n\n` +
          `A cliente não vai receber o código — e sem ele não tem como o desconto ser aplicado no caixa.\n\n` +
          `Enviar assim mesmo?`
        )) return;
      }

      // COM CANAL: o servidor manda. A aba do WhatsApp não abre — é justamente
      // isso que faz 40 contatos caberem em 20 minutos em vez de uma manhã.
      // SEM CANAL: continua exatamente como sempre foi (wa.me), pra quem não
      // conectou nada não perder nada.
      if (!TEM_CANAL) {
        const tel = (a.telefone || '').replace(/\D/g, '');
        const full = tel.length <= 11 ? '55' + tel : tel;
        // Abre o WhatsApp E marca como enviada no mesmo clique. Se marcássemos só na
        // volta pra aba, quem fecha o WhatsApp no celular nunca daria baixa — e o card
        // ficaria pendente pra sempre.
        window.open(`https://wa.me/${full}?text=${encodeURIComponent(msg)}`, '_blank');
      }

      const btn = document.getElementById('btn-env-' + id);
      if (btn) { btn.disabled = true; btn.textContent = TEM_CANAL ? 'Enviando…' : 'Marcando…'; }

      try {
        const r = await api(`/relacionamento/acoes/${id}/enviada`, { method: 'POST', body: { mensagem: msg } });

        // O envio pode falhar DEPOIS de a ação já ter sido marcada (a instância caiu,
        // o número não tem WhatsApp). A ação não volta pra fila — a lojista já decidiu
        // falar com essa cliente — mas ela precisa saber que a mensagem não saiu, e
        // ter o wa.me à mão pra resolver na hora.
        if (TEM_CANAL && !r.enviado) {
          const tel = (a.telefone || '').replace(/\D/g, '');
          const full = tel.length <= 11 ? '55' + tel : tel;
          toast(r.erro_envio ? `Não consegui enviar: ${r.erro_envio}` : 'Não consegui enviar', 'erro');
          if (confirm(`A mensagem para ${a.nome} não saiu pelo sistema.\n\nAbrir no WhatsApp pra mandar na mão?`)) {
            window.open(`https://wa.me/${full}?text=${encodeURIComponent(msg)}`, '_blank');
          }
        } else if (TEM_CANAL) {
          toast(`Enviado para ${a.nome}`);
        }

        ACOES = ACOES.filter(x => x.id !== id);
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = TEM_CANAL ? 'Enviar' : 'Enviar no WhatsApp'; }
        toast(e.message || 'Erro ao marcar como enviada', 'erro');
      }
    }

    async function copiar(id) {
      try { await navigator.clipboard.writeText(textoDe(id)); toast('Mensagem copiada'); }
      catch { toast('Não consegui copiar', 'erro'); }
    }

    async function adiar(id, dias) {
      if (!dias) return;
      try {
        await api(`/relacionamento/acoes/${id}/adiar`, { method: 'POST', body: { dias: Number(dias) } });
        ACOES = ACOES.filter(x => x.id !== id);
        render();
        toast('Adiado');
      } catch (e) { toast(e.message || 'Erro ao adiar', 'erro'); }
    }

    async function ignorar(id) {
      if (!confirm('Tirar este contato da lista?')) return;
      try {
        await api(`/relacionamento/acoes/${id}/ignorar`, { method: 'POST' });
        ACOES = ACOES.filter(x => x.id !== id);
        render();
      } catch (e) { toast(e.message || 'Erro', 'erro'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      montarLayout('relacionamento');
      carregar();
    });
  </script>
</body>
</html>
