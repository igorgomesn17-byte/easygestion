<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Email • EasyGestão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a5f3d 0%, #2d7a52 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    .logo { margin-bottom: 30px; font-size: 32px; }
    h1 { color: #1a5f3d; margin-bottom: 20px; font-size: 24px; }
    .status { margin: 30px 0; font-size: 18px; line-height: 1.6; }
    .status.sucesso { color: #27ae60; }
    .status.erro { color: #e74c3c; }
    .status.carregando { color: #f39c12; }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1a5f3d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .botoes {
      margin-top: 30px;
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primario {
      background: #1a5f3d;
      color: white;
    }
    .btn-primario:hover {
      background: #0d3a24;
    }
    .btn-secundario {
      background: #ecf0f1;
      color: #333;
    }
    .btn-secundario:hover {
      background: #d5dbdb;
    }
    .erro-detalhado {
      background: #fadbd8;
      border: 1px solid #f5b7b1;
      border-radius: 6px;
      padding: 15px;
      margin: 20px 0;
      font-size: 14px;
      color: #7b241c;
      text-align: left;
    }
    .link-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      margin: 10px 0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🔒</div>
    <h1>Verificar Email</h1>

    <div id="conteudo">
      <div class="status carregando">
        <div class="spinner"></div>
        <p>Verificando email...</p>
      </div>
    </div>
  </div>

  <script>
    async function verificarEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        mostrarErro('Token de verificação não encontrado na URL', 'URL_INVALIDA');
        return;
      }

      try {
        const resp = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await resp.json();

        if (resp.ok) {
          mostrarSucesso(data.mensagem);
        } else if (resp.status === 410) {
          mostrarExpirado(data);
        } else {
          mostrarErro(data.erro, data.codigo);
        }
      } catch (e) {
        mostrarErro('Erro ao verificar email: ' + e.message, 'ERRO_REDE');
      }
    }

    function mostrarSucesso(mensagem) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="status sucesso">
          <p style="font-size: 48px;">✅</p>
          <p style="font-size: 18px; font-weight: 600;">${mensagem}</p>
          <p style="margin-top: 10px; color: #555;">Você pode fazer login agora.</p>
        </div>
        <div class="botoes">
          <button class="btn btn-primario" onclick="window.location.href='/'">
            Ir para Login
          </button>
        </div>
      `;
    }

    function mostrarExpirado(data) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="status erro">
          <p style="font-size: 48px;">⏰</p>
          <p style="font-size: 18px; font-weight: 600;">${data.erro}</p>
          <p style="margin-top: 10px; color: #555;">Vamos reenviar o link de verificação.</p>
        </div>
        <div style="margin: 20px 0;">
          <input type="email" id="emailReenvio" placeholder="Seu email" style="
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
          ">
        </div>
        <div class="botoes">
          <button class="btn btn-primario" onclick="reenviarVerificacao()">
            Reenviar Link
          </button>
          <button class="btn btn-secundario" onclick="window.location.href='/'">
            Voltar
          </button>
        </div>
      `;
    }

    function mostrarErro(erro, codigo) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="status erro">
          <p style="font-size: 48px;">❌</p>
          <p style="font-size: 18px; font-weight: 600;">Erro na Verificação</p>
        </div>
        <div class="erro-detalhado">
          <strong>Mensagem:</strong> ${erro}<br>
          <strong>Código:</strong> ${codigo || 'DESCONHECIDO'}
        </div>
        <p style="color: #666; margin: 15px 0;">
          O link pode estar inválido, expirado ou já foi utilizado.
        </p>
        <div class="botoes">
          <button class="btn btn-primario" onclick="window.location.href='/solicitar-verificacao.html'">
            Solicitar Novo Link
          </button>
          <button class="btn btn-secundario" onclick="window.location.href='/'">
            Voltar ao Login
          </button>
        </div>
      `;
    }

    async function reenviarVerificacao() {
      const email = document.getElementById('emailReenvio').value.trim();
      if (!email) {
        alert('Por favor, informe seu email');
        return;
      }

      try {
        const resp = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await resp.json();
        if (resp.ok) {
          mostrarReenvioSucesso(email);
        } else {
          alert('Erro: ' + data.erro);
        }
      } catch (e) {
        alert('Erro ao reenviar: ' + e.message);
      }
    }

    function mostrarReenvioSucesso(email) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="status sucesso">
          <p style="font-size: 48px;">📧</p>
          <p style="font-size: 18px; font-weight: 600;">Email reenviado!</p>
          <p style="margin-top: 10px; color: #555;">
            Verifique sua caixa de entrada em <strong>${email}</strong>
          </p>
        </div>
        <div class="botoes">
          <button class="btn btn-primario" onclick="window.location.href='/'">
            Voltar ao Login
          </button>
        </div>
      `;
    }

    // Iniciar verificação quando a página carregar
    verificarEmail();
  </script>
</body>
</html>
