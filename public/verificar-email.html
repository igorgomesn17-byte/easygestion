<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Email • EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      max-width: 500px; width: 100%; padding: 38px 30px; text-align: center; }
    .logo { margin-bottom: 28px; font-size: 32px; }
    h1 { color: var(--marca); margin-bottom: 18px; font-size: 24px; font-weight: 700; }
    .auth-status { margin: 28px 0; font-size: 16px; line-height: 1.6; }
    .auth-status.sucesso { color: #27ae60; }
    .auth-status.erro { color: var(--vermelho); }
    .auth-status.carregando { color: #f39c12; }
    .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid var(--linha);
      border-top-color: var(--marca); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px 0; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .auth-botoes { margin-top: 28px; display: flex; gap: 10px; }
    .auth-btn-primary { flex: 1; padding: 12px 20px; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all .3s; background: var(--marca); color: white; }
    .auth-btn-primary:hover { background: var(--marca-escura); }
    .auth-btn-secondary { flex: 1; padding: 12px 20px; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all .3s; background: var(--linha); color: var(--tinta); }
    .auth-btn-secondary:hover { background: #d5dbdb; }
    .auth-erro-detalhado { background: #fadbd8; border: 1px solid #f5b7b1; border-radius: var(--radius-sm);
      padding: 15px; margin: 20px 0; font-size: 13px; color: var(--vermelho); text-align: left; }
    .auth-link-input { width: 100%; padding: 12px; border: 1px solid var(--linha); border-radius: var(--radius-sm);
      font-family: monospace; font-size: 12px; margin: 10px 0; word-break: break-all; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">🔒</div>
    <h1>Verificar Email</h1>

    <div id="conteudo">
      <div class="auth-status carregando">
        <div class="spinner"></div>
        <p>Verificando email...</p>
      </div>
    </div>
  </div>

  <script>
    async function verificarEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        mostrarErro('Token de verificação não encontrado na URL', 'URL_INVALIDA');
        return;
      }

      try {
        const resp = await fetch('/api/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await resp.json();

        if (resp.ok) {
          mostrarSucesso(data.mensagem);
        } else if (resp.status === 410) {
          mostrarExpirado(data);
        } else {
          mostrarErro(data.erro, data.codigo);
        }
      } catch (e) {
        mostrarErro('Erro ao verificar email: ' + e.message, 'ERRO_REDE');
      }
    }

    function mostrarSucesso(mensagem) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="auth-status sucesso">
          <p style="font-size: 48px;">✅</p>
          <p style="font-size: 18px; font-weight: 600;">${mensagem}</p>
          <p style="margin-top: 10px; color: #555;">Você pode fazer login agora.</p>
        </div>
        <div class="auth-botoes">
          <button class="auth-btn-primary" onclick="window.location.href='/'">
            Ir para Login
          </button>
        </div>
      `;
    }

    function mostrarExpirado(data) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="auth-status erro">
          <p style="font-size: 48px;">⏰</p>
          <p style="font-size: 18px; font-weight: 600;">${data.erro}</p>
          <p style="margin-top: 10px; color: #555;">Vamos reenviar o link de verificação.</p>
        </div>
        <div style="margin: 20px 0;">
          <input type="email" id="emailReenvio" placeholder="Seu email" style="
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
          ">
        </div>
        <div class="auth-botoes">
          <button class="auth-btn-primary" onclick="reenviarVerificacao()">
            Reenviar Link
          </button>
          <button class="auth-btn-secondary" onclick="window.location.href='/'">
            Voltar
          </button>
        </div>
      `;
    }

    function mostrarErro(erro, codigo) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="auth-status erro">
          <p style="font-size: 48px;">❌</p>
          <p style="font-size: 18px; font-weight: 600;">Erro na Verificação</p>
        </div>
        <div class="auth-erro-detalhado">
          <strong>Mensagem:</strong> ${erro}<br>
          <strong>Código:</strong> ${codigo || 'DESCONHECIDO'}
        </div>
        <p style="color: #666; margin: 15px 0;">
          O link pode estar inválido, expirado ou já foi utilizado.
        </p>
        <div class="auth-botoes">
          <button class="auth-btn-primary" onclick="window.location.href='/solicitar-verificacao.html'">
            Solicitar Novo Link
          </button>
          <button class="auth-btn-secondary" onclick="window.location.href='/'">
            Voltar ao Login
          </button>
        </div>
      `;
    }

    async function reenviarVerificacao() {
      const email = document.getElementById('emailReenvio').value.trim();
      if (!email) {
        alert('Por favor, informe seu email');
        return;
      }

      try {
        const resp = await fetch('/api/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await resp.json();
        if (resp.ok) {
          mostrarReenvioSucesso(email);
        } else {
          alert('Erro: ' + data.erro);
        }
      } catch (e) {
        alert('Erro ao reenviar: ' + e.message);
      }
    }

    function mostrarReenvioSucesso(email) {
      const conteudo = document.getElementById('conteudo');
      conteudo.innerHTML = `
        <div class="auth-status sucesso">
          <p style="font-size: 48px;">📧</p>
          <p style="font-size: 18px; font-weight: 600;">Email reenviado!</p>
          <p style="margin-top: 10px; color: #555;">
            Verifique sua caixa de entrada em <strong>${email}</strong>
          </p>
        </div>
        <div class="auth-botoes">
          <button class="auth-btn-primary" onclick="window.location.href='/'">
            Voltar ao Login
          </button>
        </div>
      `;
    }

    // Iniciar verificação quando a página carregar
    verificarEmail();
  </script>
</body>
</html>
