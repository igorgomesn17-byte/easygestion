<DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupom • EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    /* Cupom 80mm (Elgin i8) */
    .cupom {
      width: 80mm; max-width: 80mm; margin: 0 auto; background: #fff;
      padding: 4mm 5mm; font-family: 'Courier New', monospace; color: #000;
      font-size: 14px; line-height: 1.4;
    }
    .cupom .centro { text-align: center; }
    .cupom .marca { font-family: Georgia, serif; font-weight: 700; letter-spacing: 4px; font-size: 22px; }
    .cupom .sub { font-size: 12px; }
    .cupom hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
    .cupom .linha-item { display: flex; justify-content: space-between; }
    .cupom .total-final { font-size: 18px; font-weight: 700; }
    .cupom table { width: 100%; box-shadow: none; }
    .cupom td { padding: 2px 0; border: none; font-size: 14px; }
    .acoes { max-width: 80mm; margin: 12px auto; display: flex; flex-direction: column; gap: 8px; }
    @media print {
      @page { size: 80mm auto; margin: 0; }
      .topo, .menu, .acoes, .nao-imprime { display: none !important; }
      body { background: #fff; }
      .conteudo { padding: 0; margin: 0; }
      .cupom { width: 80mm; }
    }
  </style>
</head>
<body>
  <div class="conteudo" style="padding:10px;">
    <div class="cupom" id="cupom"><div class="vazio">Carregando...</div></div>

    <div class="acoes">
      <button class="btn btn-bloco" onclick="window.print()">Imprimir cupom</button>
      <button class="btn btn-bloco btn-verde" id="btnWhats" onclick="enviarWhats()" style="display:none;">Enviar cupom no WhatsApp</button>
      <div id="passoImagem" class="texto-cinza nao-imprime" style="display:none; font-size:0.82rem; text-align:center; line-height:1.4; background:var(--marca-clara,#e7f3ef); padding:10px; border-radius:8px;">
        📸 O cupom foi salvo como imagem. No WhatsApp que abriu, toque no <strong>clipe 📎</strong> → <strong>Galeria/Fotos</strong> e escolha o cupom (é o mais recente).
      </div>
      <a class="btn btn-bloco btn-escuro" href="pdv.html">+ Nova venda</a>
    </div>
  </div>

  <script src="js/comum.js"></script>
  <script>
    const vendaId = new URLSearchParams(location.search).get('venda');
    let venda = null, loja = {};

    let selosCliente = null;
    let troca = null;
    async function carregar() {
      loja = await api('/config');
      venda = await api('/vendas/' + vendaId);
      // selos do clube (se houver cliente e clube ativo). A rota vive em
      // /relacionamento/clube/cliente/:id (gated no Growth) — no Starter dá 403 e o
      // catch silencioso segue sem o bloco de selos, sem erro na cara da vendedora.
      if (venda.cliente_id) {
        try { const s = await api('/relacionamento/clube/cliente/' + venda.cliente_id); if (s.ativo) selosCliente = s; } catch(e) {}
      }
      // Buscar troca associada (se houver)
      try {
        const trocas = await api('/trocas?venda_id=' + vendaId);
        if (trocas && trocas.length > 0) troca = trocas[0];
      } catch(e) {}
      render();
      // A12: cupom automático no pós-venda (se ligado no config). Espera renderizar e dispara a impressão.
      if (String(loja.cupom_auto_imprimir) === '1') {
        setTimeout(() => { try { window.print(); } catch(e) {} }, 600);
      }
    }

    function render() {
      const data = venda.data_hora.slice(0,10).split('-').reverse().join('/');
      const hora = venda.data_hora.slice(11,16);
      const itens = venda.itens.map(i =>
        `<tr><td>${i.qtd}x ${esc(i.descricao)}</td><td style="text-align:right;">${moeda(i.preco_unit*i.qtd)}</td></tr>`).join('');

      document.getElementById('cupom').innerHTML = `
        <div class="centro">
          <div class="marca">${loja.loja_nome||'EasyGestão'}</div>
          ${loja.loja_razao_social?`<div class="sub">${loja.loja_razao_social}</div>`:''}
          ${loja.loja_cnpj?`<div class="sub">CNPJ: ${loja.loja_cnpj}${loja.loja_ie?' • IE: '+loja.loja_ie:''}</div>`:''}
          <div class="sub">${loja.loja_endereco||''}</div>
          <div class="sub">${loja.loja_instagram||''} ${loja.loja_telefone?'• '+loja.loja_telefone:''}</div>
        </div>
        <hr>
        <div class="sub">Venda #${venda.id} • ${data} ${hora}</div>
        ${venda.vendedor_nome?`<div class="sub">Vendedora: ${esc(venda.vendedor_nome)}</div>`:''}
        ${venda.cliente_nome?`<div class="sub">Cliente: ${esc(venda.cliente_nome)}</div>`:''}
        <hr>
        <table>${itens}</table>
        <hr>
        <table>
          <tr><td>Subtotal</td><td style="text-align:right;">${moeda(venda.subtotal)}</td></tr>
          ${venda.desconto>0?`<tr><td>Desconto</td><td style="text-align:right;">-${moeda(venda.desconto)}</td></tr>`:''}
          ${venda.acrescimo>0?`<tr><td>Acrescimo (parcelamento)</td><td style="text-align:right;">+${moeda(venda.acrescimo)}</td></tr>`:''}
        </table>
        <hr>
        <div class="linha-item total-final"><span>TOTAL</span><span>${moeda(venda.total)}</span></div>
        <div class="sub">Pagamento: ${textoPagamentoVenda(venda)}</div>
        ${venda.troco>0?`<div class="sub">Troco: ${moeda(venda.troco)}${venda.troco_forma==='pix'?' (devolvido por Pix)':''}</div>`:''}
        ${troca?`<hr><div class="centro sub" style="font-weight:700;">VENDA COM TROCA</div><div class="sub">Devolvido: ${moeda(troca.valor_devolvido)}</div><div class="sub">Levado: ${moeda(troca.valor_levado)}</div>${troca.diferenca !== 0 ? `<div class="sub">Diferença ${troca.diferenca > 0 ? '(pago)' : '(vale)'}: ${moeda(Math.abs(troca.diferenca))}</div>` : ''}`:''}
        ${venda.comprovante?`<div class="sub nao-imprime"><a href="${venda.comprovante}" target="_blank">Ver comprovante</a></div>`:''}
        <hr>
        ${selosCliente ? `<div class="centro sub">${loja.clube_nome||'Clube Fidelidade'}: <strong>${selosCliente.selos_no_cartao}/${selosCliente.total_selos} selos</strong>${selosCliente.faltam>0?` • faltam ${selosCliente.faltam} pro prêmio `:` • prêmio liberado `}</div><hr>`:''}
        <div class="centro sub" style="font-weight:700;">
          ${(loja.cupom_politica_troca||'TROCAS EM ATÉ 7 DIAS\ncom a peça e este cupom').split('\n')[0]}<br>
          <span style="font-weight:400;">${(loja.cupom_politica_troca||'TROCAS EM ATÉ 7 DIAS\ncom a peça e este cupom').split('\n').slice(1).join('<br>')}</span>
        </div>
        <hr>
        <div class="centro sub">
          ${loja.cupom_mensagem_rodape||'Obrigada por comprar conosco'}<br>
          Volte sempre, ${loja.loja_instagram||''}<br><br>
          *Este nao e documento fiscal*
        </div>`;

      // botao whats so se cliente tiver telefone
      if (venda.cliente_tel) document.getElementById('btnWhats').style.display = 'flex';
    }

    // Carrega o html2canvas sob demanda (200KB — só quando a lojista de fato clica em
    // enviar). Servido do próprio servidor porque o CSP bloqueia CDN.
    let _h2cPromise = null;
    function carregarHtml2canvas() {
      if (window.html2canvas) return Promise.resolve(window.html2canvas);
      if (_h2cPromise) return _h2cPromise;
      _h2cPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'js/html2canvas.min.js';
        s.onload = () => window.html2canvas ? resolve(window.html2canvas) : reject(new Error('html2canvas não carregou'));
        s.onerror = () => reject(new Error('não consegui carregar o gerador de imagem'));
        document.head.appendChild(s);
      });
      return _h2cPromise;
    }

    // "Fotografa" o cupom (o elemento #cupom, aquele recibo bonito) e devolve um File PNG.
    async function cupomComoImagem() {
      const html2canvas = await carregarHtml2canvas();
      const canvas = await html2canvas(document.getElementById('cupom'), {
        backgroundColor: '#ffffff',
        scale: 2,   // 2x = imagem nítida, boa de ler no celular
      });
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const nome = `cupom-${(loja.loja_nome||'loja').replace(/[^a-z0-9]/gi,'')}-${vendaId}.png`;
      return new File([blob], nome, { type: 'image/png' });
    }

    // Mensagem curta que acompanha o cupom.
    function textoAcompanha() {
      const nome = loja.loja_nome || 'EasyGestão';
      return `*${nome}* — segue o cupom da sua compra 🧾\n${loja.cupom_mensagem_rodape||'Obrigada por comprar conosco'}, volte sempre! ${loja.loja_instagram||''}`.trim();
    }

    async function enviarWhats() {
      const btn = document.getElementById('btnWhats');
      const txtOriginal = btn.textContent;
      btn.disabled = true; btn.textContent = 'Gerando cupom…';
      try {
        const arquivo = await cupomComoImagem();

        // MELHOR CAMINHO (celular): compartilhamento nativo — manda a IMAGEM direto pro
        // WhatsApp num toque, sem baixar nem anexar à mão. Só existe em https + celular.
        if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
          await navigator.share({ files: [arquivo], text: textoAcompanha() });
          return;   // o menu do sistema abre; a lojista escolhe WhatsApp → a cliente
        }

        // FALLBACK (PC ou navegador sem share): baixa a imagem e abre o WhatsApp com o
        // texto. A lojista anexa a imagem que acabou de baixar (o passo aparece na tela).
        const url = URL.createObjectURL(arquivo);
        const a = document.createElement('a');
        a.href = url; a.download = arquivo.name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        document.getElementById('passoImagem').style.display = 'block';
        abrirWhatsappComTexto(venda.cliente_tel, textoAcompanha());
      } catch (e) {
        console.error('[cupom] falha ao gerar imagem:', e);
        // Se o gerador de imagem falhar, não deixa a lojista na mão: manda o texto (o
        // comportamento antigo) como último recurso.
        const itens = venda.itens.map(i => `• ${i.qtd}x ${i.descricao} - ${moeda(i.preco_unit*i.qtd)}`).join('\n');
        let txt = `*${loja.loja_nome||'EasyGestão'}*\nRecibo da sua compra\n\n${itens}\n\n`;
        if (venda.desconto>0) txt += `Desconto: -${moeda(venda.desconto)}\n`;
        txt += `*Total: ${moeda(venda.total)}*\nPagamento: ${textoPagamentoVenda(venda)}\n\n`;
        txt += textoAcompanha();
        abrirWhatsappComTexto(venda.cliente_tel, txt);
        toast('Mandei em texto (não consegui gerar a imagem do cupom).', 'erro');
      } finally {
        btn.disabled = false; btn.textContent = txtOriginal;
      }
    }

    carregar();
  </script>
</body>
</html>
