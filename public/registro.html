<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Conta — EasyGestão</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --marca: #1a6f5e;
      --marca-escura: #0d3d35;
      --surface: #FFFFFF;
      --surface-alt: #f5f3f0;
      --tinta: #2d3436;
      --tinta-2: #5b6470;
      --tinta-3: #99a0ab;
      --linha: #e8e3dd;
      --radius-sm: 8px;
      --vermelho: #D64545;
    }

    html {
      height: auto;
      overflow-y: scroll;
    }

    body {
      background: linear-gradient(160deg, #1a6f5e 0%, #0d3d35 100%);
      padding: 20px 12px;
      display: block;
      height: auto;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--tinta);
      font-size: 14.5px;
      line-height: 1.55;
      letter-spacing: -0.006em;
    }
    .auth-card { background: #FFFFFF; border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      width: 100%; max-width: 700px; padding: 24px 24px; text-align: center; margin: 0 auto 20px; }
    .logo { height: auto; max-width: 200px; max-height: 60px; margin: 0 auto 8px;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.12)); object-fit: contain; display: block; }
    h2 { color: var(--tinta); font-size: 1rem; font-weight: 700; margin-bottom: 12px; text-align: center; }
    .form-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .form-grid.full { width: 100%; }
    .auth-campo { text-align: left; }
    .auth-campo label { display: block; font-size: .75rem; font-weight: 500; color: var(--tinta-2);
      margin: 6px 0 3px; }
    .auth-campo input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--linha);
      border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; transition: border-color .2s; box-sizing: border-box; }
    .auth-campo input:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 2px rgba(26,111,94,.1); }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 35px; }
    .toggle-senha { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: 0; border: 0;
      cursor: pointer; font-size: 14px; color: #aaa; padding: 4px; margin: 0; transition: color .2s; z-index: 10; }
    .toggle-senha:hover { color: var(--marca); }
    .auth-btn { width: 100%; min-height: 52px; margin-top: 22px; border: none; border-radius: var(--radius-sm);
      background: var(--marca); color: #fff; font-family: inherit; font-weight: 600; font-size: 1rem;
      cursor: pointer; transition: background .2s; }
    .auth-btn:hover { background: var(--marca-escura); }
    .auth-btn:disabled { opacity: .6; cursor: wait; }
    .strength-meter { margin-top: 3px; height: 3px; background: var(--linha); border-radius: 1px; overflow: hidden; }
    .strength-bar { height: 100%; width: 0%; transition: width .3s, background-color .3s; background-color: var(--marca); }
    .strength-text { font-size: 11px; margin-top: 2px; color: var(--tinta-3); }
    .auth-checkbox { margin: 12px 0; padding: 10px; background: var(--surface-alt); border-radius: var(--radius-sm);
      border-left: 3px solid var(--marca); }
    .auth-checkbox label { display: flex; align-items: flex-start; margin: 0; font-weight: 400; cursor: pointer;
      font-size: 12px; color: var(--tinta-2); }
    .auth-checkbox input[type="checkbox"] { margin-right: 6px; margin-top: 2px; cursor: pointer; min-width: 16px;
      accent-color: var(--marca); }
    .auth-checkbox a { color: var(--marca); text-decoration: none; font-weight: 500; border-bottom: 1px solid transparent;
      transition: border-color .2s; }
    .auth-checkbox a:hover { border-bottom-color: var(--marca); }
    .auth-msg { margin-top: 10px; padding: 10px; border-radius: var(--radius-sm); font-size: 12px; display: none; }
    .auth-msg.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; }
    .auth-msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; display: block; }
    .message { margin-top: 10px; padding: 10px; border-radius: var(--radius-sm); font-size: 12px; }
    .message.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; display: block; }
    .message.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; display: block; }
    .auth-footer { text-align: center; margin-top: 12px; font-size: 12px; color: var(--tinta-3); }
    .auth-footer a { color: var(--marca); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .help-text { font-size: 11px; color: #999; margin-top: 2px; }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .auth-card { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" style="max-width:240px;height:auto;display:block;margin:0 auto">
        <g transform="translate(24 43) scale(1.2000)">
          <g transform="rotate(-24 24 62)"><path d="M11 56 a7 7 0 0 1 7 -7 H34 a6 6 0 0 1 6 6 V71 a6 6 0 0 1 -6 6 H18 a7 7 0 0 1 -7 -7 Z M21 55.6 a3.4 3.4 0 1 0 0 6.8 a3.4 3.4 0 1 0 0 -6.8 Z" fill="#c39a36" fill-rule="evenodd"></path></g>
          <path d="M45 46 V36 a15 15 0 0 1 30 0 V46" fill="none" stroke="#1c4a35" stroke-width="7.5" stroke-linecap="round"></path>
          <path d="M31 45 H89 L83.5 93 a8 8 0 0 1 -8 7 H43.5 a8 8 0 0 1 -8 -7 Z M47.5 74 H51.5 A2.5 2.5 0 0 1 54 76.5 V85.5 A2.5 2.5 0 0 1 51.5 88 H47.5 A2.5 2.5 0 0 1 45 85.5 V76.5 A2.5 2.5 0 0 1 47.5 74 Z M58.5 66 H62.5 A2.5 2.5 0 0 1 65 68.5 V85.5 A2.5 2.5 0 0 1 62.5 88 H58.5 A2.5 2.5 0 0 1 56 85.5 V68.5 A2.5 2.5 0 0 1 58.5 66 Z M69.5 58 H73.5 A2.5 2.5 0 0 1 76 60.5 V85.5 A2.5 2.5 0 0 1 73.5 88 H69.5 A2.5 2.5 0 0 1 67 85.5 V60.5 A2.5 2.5 0 0 1 69.5 58 Z" fill="#1c4a35" fill-rule="evenodd"></path>
        </g>
        <text x="186" y="123" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="96" letter-spacing="-3" fill="#1c4a35">Easy<tspan fill="#c39a36">Gestão</tspan></text>
      </svg>
    </div>

    <h2>Criar Conta — Teste Grátis de 14 Dias</h2>

    <form id="formRegistro">
      <div class="form-grid">
        <div class="auth-campo">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          >
        </div>

        <div class="auth-campo">
          <label for="nome_loja">Nome da Loja</label>
          <input
            type="text"
            id="nome_loja"
            name="nome_loja"
            placeholder="ex: DS Store"
            required
          >
        </div>

        <div class="auth-campo">
          <label for="nome_responsavel">Seu Nome Completo</label>
          <input
            type="text"
            id="nome_responsavel"
            name="nome_responsavel"
            placeholder="ex: Maria Silva"
            required
          >
        </div>

        <div class="auth-campo">
          <label for="telefone">Telefone / WhatsApp</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(11) 99999-9999"
            required
          >
        </div>

        <div class="auth-campo">
          <label for="cpf_cnpj">CPF ou CNPJ</label>
          <input
            type="text"
            id="cpf_cnpj"
            name="cpf_cnpj"
            placeholder="123.456.789-01 ou 12.345.678/0001-99"
            required
          >
          <div class="help-text">CPF (11 dígitos) ou CNPJ (14 dígitos)</div>
        </div>

        <div class="auth-campo">
          <label for="senha">Senha (Mín. 8 caracteres)</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Mínimo 8 caracteres"
              minlength="8"
              required
            >
            <button type="button" class="toggle-senha" id="toggleSenha">👁️</button>
          </div>
          <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
        </div>

        <div class="auth-campo">
          <label for="confirma_senha">Confirmar Senha</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirma_senha"
              name="confirma_senha"
              placeholder="Repita a senha"
              minlength="8"
              required
            >
            <button type="button" class="toggle-senha" id="toggleConfirma">👁️</button>
          </div>
        </div>
      </div>

      <div class="auth-checkbox">
        <label for="termos">
          <input
            type="checkbox"
            id="termos"
            name="termos"
            required
          >
          <span>Concordo com os <a href="/termos.html" target="_blank">termos de uso</a> e <a href="/privacidade.html" target="_blank">política de privacidade</a></span>
        </label>
      </div>

      <button type="submit" id="btnRegistrar">Criar Conta</button>
      <div id="mensagem" class="auth-msg"></div>
    </form>

    
    <div class="auth-footer">
      Já tem conta? <a href="/login.html">Entre aqui</a>
    </div>

    
    <div class="footer">
      © 2026 EasyGestão — Gestão inteligente para sua loja
    </div>
  </div>

  <script>
    // Máscara para CPF/CNPJ
    document.getElementById('cpf_cnpj').addEventListener('input', (e) => {
      let valor = e.target.value.replace(/\D/g, '');

      if (valor.length <= 11) {
        // CPF: 123.456.789-01
        if (valor.length > 3) {
          valor = valor.slice(0, 3) + '.' + valor.slice(3);
        }
        if (valor.length > 7) {
          valor = valor.slice(0, 7) + '.' + valor.slice(7);
        }
        if (valor.length > 11) {
          valor = valor.slice(0, 11) + '-' + valor.slice(11);
        }
      } else {
        // CNPJ: 12.345.678/0001-99
        if (valor.length > 2) {
          valor = valor.slice(0, 2) + '.' + valor.slice(2);
        }
        if (valor.length > 6) {
          valor = valor.slice(0, 6) + '.' + valor.slice(6);
        }
        if (valor.length > 10) {
          valor = valor.slice(0, 10) + '/' + valor.slice(10);
        }
        if (valor.length > 15) {
          valor = valor.slice(0, 15) + '-' + valor.slice(15);
        }
      }

      e.target.value = valor;
    });

    // Toggle de visibilidade da senha
    document.getElementById('toggleSenha').addEventListener('click', (e) => {
      e.preventDefault();
      const input = document.getElementById('senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('toggleConfirma').addEventListener('click', (e) => {
      e.preventDefault();
      const input = document.getElementById('confirma_senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Indicador de força de senha (simplificado)
    document.getElementById('senha').addEventListener('input', (e) => {
      const senha = e.target.value;
      let score = 0;

      if (senha.length >= 8) score++;
      if (senha.length >= 12) score++;
      if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) score++;
      if (/\d/.test(senha)) score++;

      const forcas = [
        { pct: 0, cor: '#ddd', texto: '' },
        { pct: 25, cor: '#f44336', texto: 'Fraca' },
        { pct: 50, cor: '#ff9800', texto: 'Normal' },
        { pct: 75, cor: '#8bc34a', texto: 'Forte' },
        { pct: 100, cor: '#4caf50', texto: 'Muito Forte ✓' }
      ];

      const f = forcas[score];
      document.getElementById('strengthBar').style.width = f.pct + '%';
      document.getElementById('strengthBar').style.backgroundColor = f.cor;
      document.getElementById('strengthText').textContent = f.texto;
    });

    // Validar senhas
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const nome_loja = document.getElementById('nome_loja').value.trim();
      const nome_responsavel = document.getElementById('nome_responsavel').value.trim();
      const cpf_cnpj = document.getElementById('cpf_cnpj').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const senha = document.getElementById('senha').value;
      const confirma_senha = document.getElementById('confirma_senha').value;
      const termos = document.getElementById('termos').checked;

      // Validações no frontend
      if (!email.includes('@')) {
        mostrarMensagem('Email inválido', 'error');
        return;
      }
      if (senha.length < 8) {
        mostrarMensagem('Senha precisa de no mínimo 8 caracteres', 'error');
        return;
      }
      if (senha !== confirma_senha) {
        mostrarMensagem('Senhas não coincidem', 'error');
        return;
      }
      if (!termos) {
        mostrarMensagem('Você precisa concordar com os termos de uso e política de privacidade', 'error');
        return;
      }

      const btn = document.getElementById('btnRegistrar');
      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        const res = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha, nome_loja, nome_responsavel, telefone, cpf_cnpj })
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          mostrarMensagem(data.mensagem || 'Conta criada! Verifique seu email.', 'success');
          setTimeout(() => {
            window.location.href = data.destino || '/verifique-seu-email.html';
          }, 1500);
        } else {
          mostrarMensagem(data.erro || 'Erro ao criar conta', 'error');
        }
      } catch (err) {
        console.error(err);
        mostrarMensagem('Erro ao conectar com o servidor', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar Conta';
      }
    });

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `message ${tipo}`;
    }
  </script>
</body>
</html>
