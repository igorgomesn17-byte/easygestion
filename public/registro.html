<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Conta — EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      width: 100%; max-width: 420px; padding: 38px 30px; text-align: center; }
    .logo { height: auto; max-width: 280px; max-height: 80px; margin: 0 auto 12px;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.12)); object-fit: contain; display: block; }
    h2 { color: var(--tinta); font-size: 1.2rem; font-weight: 700; margin-bottom: 22px; text-align: center; }
    .auth-campo { margin-bottom: 18px; text-align: left; }
    .auth-campo label { display: block; font-size: .82rem; font-weight: 500; color: var(--tinta-2);
      margin: 12px 0 5px; }
    .auth-campo input { width: 100%; min-height: 46px; padding: 12px 14px; border: 1px solid var(--linha);
      border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; transition: border-color .2s; }
    .auth-campo input:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px rgba(26,111,94,.15); }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-senha { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: 0; border: 0;
      cursor: pointer; font-size: 16px; color: #aaa; padding: 6px; margin: 0; transition: color .2s; z-index: 10; }
    .toggle-senha:hover { color: var(--marca); }
    .auth-btn { width: 100%; min-height: 48px; margin-top: 18px; border: none; border-radius: var(--radius-sm);
      background: var(--marca); color: #fff; font-family: inherit; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: background .2s, transform .2s; }
    .auth-btn:hover:not(:disabled) { background: var(--marca-escura); transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26,111,94,.3); }
    .auth-btn:disabled { opacity: .6; cursor: wait; }
    .strength-meter { margin-top: 6px; height: 4px; background: var(--linha); border-radius: 2px; overflow: hidden; }
    .strength-bar { height: 100%; width: 0%; transition: width .3s, background-color .3s; background-color: var(--marca); }
    .strength-text { font-size: 12px; margin-top: 4px; color: var(--tinta-3); }
    .auth-checkbox { margin-bottom: 20px; padding: 14px; background: var(--surface-alt); border-radius: var(--radius-sm);
      border-left: 4px solid var(--marca); }
    .auth-checkbox label { display: flex; align-items: flex-start; margin: 0; font-weight: 400; cursor: pointer;
      font-size: 13px; color: var(--tinta-2); }
    .auth-checkbox input[type="checkbox"] { margin-right: 8px; margin-top: 3px; cursor: pointer; min-width: 18px;
      accent-color: var(--marca); }
    .auth-checkbox a { color: var(--marca); text-decoration: none; font-weight: 500; border-bottom: 1px solid transparent;
      transition: border-color .2s; }
    .auth-checkbox a:hover { border-bottom-color: var(--marca); }
    .auth-msg { margin-top: 15px; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; display: none; }
    .auth-msg.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; }
    .auth-msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; display: block; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--tinta-3); }
    .auth-footer a { color: var(--marca); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" style="max-width:240px;height:auto;display:block;margin:0 auto">
        <g transform="translate(24 43) scale(1.2000)">
          <g transform="rotate(-24 24 62)"><path d="M11 56 a7 7 0 0 1 7 -7 H34 a6 6 0 0 1 6 6 V71 a6 6 0 0 1 -6 6 H18 a7 7 0 0 1 -7 -7 Z M21 55.6 a3.4 3.4 0 1 0 0 6.8 a3.4 3.4 0 1 0 0 -6.8 Z" fill="#c39a36" fill-rule="evenodd"></path></g>
          <path d="M45 46 V36 a15 15 0 0 1 30 0 V46" fill="none" stroke="#1c4a35" stroke-width="7.5" stroke-linecap="round"></path>
          <path d="M31 45 H89 L83.5 93 a8 8 0 0 1 -8 7 H43.5 a8 8 0 0 1 -8 -7 Z M47.5 74 H51.5 A2.5 2.5 0 0 1 54 76.5 V85.5 A2.5 2.5 0 0 1 51.5 88 H47.5 A2.5 2.5 0 0 1 45 85.5 V76.5 A2.5 2.5 0 0 1 47.5 74 Z M58.5 66 H62.5 A2.5 2.5 0 0 1 65 68.5 V85.5 A2.5 2.5 0 0 1 62.5 88 H58.5 A2.5 2.5 0 0 1 56 85.5 V68.5 A2.5 2.5 0 0 1 58.5 66 Z M69.5 58 H73.5 A2.5 2.5 0 0 1 76 60.5 V85.5 A2.5 2.5 0 0 1 73.5 88 H69.5 A2.5 2.5 0 0 1 67 85.5 V60.5 A2.5 2.5 0 0 1 69.5 58 Z" fill="#1c4a35" fill-rule="evenodd"></path>
        </g>
        <text x="186" y="123" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="96" letter-spacing="-3" fill="#1c4a35">Easy<tspan fill="#c39a36">Gestão</tspan></text>
      </svg>
    </div>

    <h2>Criar Conta</h2>

    <form id="formRegistro">
      <div class="auth-campo">
        <label for="email">Email da Loja</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
        >
      </div>

      
      <div class="auth-campo">
        <label for="nome_loja">Nome da Loja</label>
        <input
          type="text"
          id="nome_loja"
          name="nome_loja"
          placeholder="ex: DS Store"
          required
        >
      </div>

      
      <div class="auth-campo">
        <label for="nome_responsavel">Seu Nome Completo</label>
        <input
          type="text"
          id="nome_responsavel"
          name="nome_responsavel"
          placeholder="ex: Maria Silva"
          required
        >
      </div>

      
      <div class="auth-campo">
        <label for="telefone">Telefone / WhatsApp</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          placeholder="(11) 9 9999-9999"
          required
        >
      </div>

      
      <div class="auth-campo">
        <label for="senha">Senha (Mínimo 8 caracteres)</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Mínimo 8 caracteres"
            minlength="8"
            required
          >
          <button type="button" class="toggle-senha" id="toggleSenha">👁️</button>
        </div>
        <div class="strength-meter">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      
      <div class="auth-campo">
        <label for="confirma_senha">Confirmar Senha</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="confirma_senha"
            name="confirma_senha"
            placeholder="Repita a senha"
            minlength="8"
            required
          >
          <button type="button" class="toggle-senha" id="toggleConfirma" title="Mostrar/ocultar">👁️</button>
        </div>
      </div>

      
      <div class="auth-checkbox">
        <label for="termos">
          <input
            type="checkbox"
            id="termos"
            name="termos"
            required
          >
          <span>Concordo com os <a href="/termos.html" target="_blank">termos de uso</a> e <a href="/privacidade.html" target="_blank">política de privacidade</a> (LGPD)</span>
        </label>
      </div>

      
      <button type="submit" id="btnRegistrar">✨ Começar Teste de 14 Dias</button>
      <div id="mensagem" class="auth-msg"></div>
    </form>

    
    <div class="auth-footer">
      Já tem conta? <a href="/login.html">Entre aqui</a>
    </div>

    
    <div class="footer">
      © 2026 EasyGestão — Gestão inteligente para sua loja
    </div>
  </div>

  <script>
    // Toggle de visibilidade da senha
    document.getElementById('toggleSenha').addEventListener('click', (e) => {
      e.preventDefault();
      const input = document.getElementById('senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('toggleConfirma').addEventListener('click', (e) => {
      e.preventDefault();
      const input = document.getElementById('confirma_senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Indicador de força de senha (simplificado)
    document.getElementById('senha').addEventListener('input', (e) => {
      const senha = e.target.value;
      let score = 0;

      if (senha.length >= 8) score++;
      if (senha.length >= 12) score++;
      if (/[a-z]/.test(senha) && /[A-Z]/.test(senha)) score++;
      if (/\d/.test(senha)) score++;

      const forcas = [
        { pct: 0, cor: '#ddd', texto: '' },
        { pct: 25, cor: '#f44336', texto: 'Fraca' },
        { pct: 50, cor: '#ff9800', texto: 'Normal' },
        { pct: 75, cor: '#8bc34a', texto: 'Forte' },
        { pct: 100, cor: '#4caf50', texto: 'Muito Forte ✓' }
      ];

      const f = forcas[score];
      document.getElementById('strengthBar').style.width = f.pct + '%';
      document.getElementById('strengthBar').style.backgroundColor = f.cor;
      document.getElementById('strengthText').textContent = f.texto;
    });

    // Validar senhas
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const nome_loja = document.getElementById('nome_loja').value.trim();
      const nome_responsavel = document.getElementById('nome_responsavel').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const senha = document.getElementById('senha').value;
      const confirma_senha = document.getElementById('confirma_senha').value;
      const termos = document.getElementById('termos').checked;

      // Validações no frontend
      if (!email.includes('@')) {
        mostrarMensagem('Email inválido', 'error');
        return;
      }
      if (senha.length < 8) {
        mostrarMensagem('Senha precisa de no mínimo 8 caracteres', 'error');
        return;
      }
      if (senha !== confirma_senha) {
        mostrarMensagem('Senhas não coincidem', 'error');
        return;
      }
      if (!termos) {
        mostrarMensagem('Você precisa concordar com os termos de uso e política de privacidade', 'error');
        return;
      }

      const btn = document.getElementById('btnRegistrar');
      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        const res = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha, nome_loja, nome_responsavel, telefone })
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          mostrarMensagem(data.mensagem || 'Conta criada! Verifique seu email.', 'success');
          setTimeout(() => {
            window.location.href = data.destino || '/verifique-seu-email.html';
          }, 1500);
        } else {
          mostrarMensagem(data.erro || 'Erro ao criar conta', 'error');
        }
      } catch (err) {
        console.error(err);
        mostrarMensagem('Erro ao conectar com o servidor', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar Conta Grátis';
      }
    });

    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `message ${tipo}`;
    }
  </script>
</body>
</html>
