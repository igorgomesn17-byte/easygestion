<DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Entrar • EasyGestão</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/ds.css">
  <style>
    /* Auth pages: centered card layout */
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      width: 100%; max-width: 380px; padding: 38px 30px; text-align: center; }
    .logo { height: auto; max-width: 280px; max-height: 80px; margin: 0 auto 12px;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.12)); object-fit: contain; display: block; }
    .marca { font-weight: 700; letter-spacing: 1px; font-size: 1.4rem; color: var(--marca-escura); display: none; }
    .sub { color: var(--tinta-2); font-size: .85rem; letter-spacing: 2px; margin: 6px 0 26px; text-transform: uppercase; }
    .auth-campo label { display: block; text-align: left; font-size: .82rem; font-weight: 500; color: var(--tinta-2);
      margin: 14px 0 5px; }
    .auth-campo input { width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--linha);
      border-radius: var(--radius-sm); font-size: 16px; font-family: inherit; }
    .auth-campo input:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px rgba(26,111,94,.15); }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-senha { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: 0; border: 0;
      cursor: pointer; font-size: 16px; color: #aaa; padding: 6px; margin: 0; transition: color .2s; z-index: 10; }
    .toggle-senha:hover { color: var(--marca); }
    .auth-btn { width: 100%; min-height: 52px; margin-top: 22px; border: none; border-radius: var(--radius-sm);
      background: var(--marca); color: #fff; font-family: inherit; font-weight: 600; font-size: 1rem;
      cursor: pointer; transition: background .2s; }
    .auth-btn:hover { background: var(--marca-escura); }
    .auth-btn:disabled { opacity: .6; cursor: wait; }
    .auth-erro { color: var(--vermelho); font-size: .85rem; margin-top: 14px; min-height: 18px; }
    .auth-links { display: flex; justify-content: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
    .auth-link { display: inline-block; font-size: .82rem; color: var(--marca); text-decoration: none; }
    .auth-link:hover { color: var(--marca-escura); }
  </style>
</head>
<body>
  <form class="auth-card" id="form">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" style="max-width:240px;height:auto;margin:0 auto 15px">
      <g transform="translate(24 43) scale(1.2000)">
        <g transform="rotate(-24 24 62)"><path d="M11 56 a7 7 0 0 1 7 -7 H34 a6 6 0 0 1 6 6 V71 a6 6 0 0 1 -6 6 H18 a7 7 0 0 1 -7 -7 Z M21 55.6 a3.4 3.4 0 1 0 0 6.8 a3.4 3.4 0 1 0 0 -6.8 Z" fill="#c39a36" fill-rule="evenodd"></path></g>
        <path d="M45 46 V36 a15 15 0 0 1 30 0 V46" fill="none" stroke="#1c4a35" stroke-width="7.5" stroke-linecap="round"></path>
        <path d="M31 45 H89 L83.5 93 a8 8 0 0 1 -8 7 H43.5 a8 8 0 0 1 -8 -7 Z M47.5 74 H51.5 A2.5 2.5 0 0 1 54 76.5 V85.5 A2.5 2.5 0 0 1 51.5 88 H47.5 A2.5 2.5 0 0 1 45 85.5 V76.5 A2.5 2.5 0 0 1 47.5 74 Z M58.5 66 H62.5 A2.5 2.5 0 0 1 65 68.5 V85.5 A2.5 2.5 0 0 1 62.5 88 H58.5 A2.5 2.5 0 0 1 56 85.5 V68.5 A2.5 2.5 0 0 1 58.5 66 Z M69.5 58 H73.5 A2.5 2.5 0 0 1 76 60.5 V85.5 A2.5 2.5 0 0 1 73.5 88 H69.5 A2.5 2.5 0 0 1 67 85.5 V60.5 A2.5 2.5 0 0 1 69.5 58 Z" fill="#1c4a35" fill-rule="evenodd"></path>
      </g>
      <text x="186" y="123" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="96" letter-spacing="-3" fill="#1c4a35">Easy<tspan fill="#c39a36">Gestão</tspan></text>
    </svg>
    <div class="marca" style="display:none">Minha Loja</div>
    <div class="sub">Sistema de Gestão</div>

    <div class="auth-campo">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" autofocus required>
    </div>

    <div class="auth-campo">
      <label for="senha">Senha</label>
      <div class="password-wrapper">
        <input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" required>
        <button type="button" class="toggle-senha" id="toggleSenha" title="Mostrar/ocultar senha">Mostrar</button>
      </div>
    </div>

    <button type="submit" id="btn" class="auth-btn">Entrar</button>
    <div class="auth-erro" id="erro"></div>

    <div class="auth-links">
      <a class="auth-link" href="esqueci-senha.html">Esqueci a senha →</a>
      <a class="auth-link" href="registro.html" style="font-weight:600">Criar Conta →</a>
    </div>
  </form>

  <script src="js/login.js"></script>
</body>
</html>
