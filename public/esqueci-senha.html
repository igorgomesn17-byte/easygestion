<DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci Minha Senha — EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      width: 100%; max-width: 420px; padding: 38px 30px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo svg { max-width: 200px; height: auto; margin: 0 auto; display: block; }
    .logo h1 { color: var(--marca); font-size: 28px; margin: 0 0 8px 0; font-weight: 700; display: none; }
    .logo p { color: var(--tinta-2); margin: 0; font-size: 14px; display: none; }
    .auth-campo { margin-bottom: 20px; }
    .auth-campo label { display: block; margin-bottom: 8px; color: var(--tinta-2); font-weight: 500; font-size: .85rem; }
    .auth-campo input { width: 100%; padding: 12px 14px; border: 1px solid var(--linha); border-radius: var(--radius-sm);
      font-size: 14px; transition: border-color .2s; }
    .auth-campo input:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px rgba(26,111,94,.15); }
    .auth-btn { width: 100%; min-height: 48px; margin-top: 6px; background: var(--marca); color: white; border: none;
      border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, transform .2s; }
    .auth-btn:hover:not(:disabled) { background: var(--marca-escura); transform: translateY(-2px); }
    .auth-btn:disabled { opacity: .6; cursor: wait; }
    .auth-msg { margin-top: 16px; padding: 12px; border-radius: var(--radius-sm); display: none; font-size: 13px; }
    .auth-msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; display: block; }
    .auth-msg.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; display: block; }
    .auth-link-back { text-align: center; margin-top: 18px; }
    .auth-link-back a { color: var(--marca); text-decoration: none; font-size: 13px; font-weight: 500; }
    .auth-link-back a:hover { text-decoration: underline; }
    .auth-info { background: var(--surface-alt); padding: 14px; border-radius: var(--radius-sm);
      margin-bottom: 20px; color: var(--tinta-2); font-size: 13px; line-height: 1.6; border-left: 4px solid var(--marca); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" style="max-width:200px;height:auto;display:block;margin:0 auto">
        <g transform="translate(24 43) scale(1.2000)">
          <g transform="rotate(-24 24 62)"><path d="M11 56 a7 7 0 0 1 7 -7 H34 a6 6 0 0 1 6 6 V71 a6 6 0 0 1 -6 6 H18 a7 7 0 0 1 -7 -7 Z M21 55.6 a3.4 3.4 0 1 0 0 6.8 a3.4 3.4 0 1 0 0 -6.8 Z" fill="#c39a36" fill-rule="evenodd"></path></g>
          <path d="M45 46 V36 a15 15 0 0 1 30 0 V46" fill="none" stroke="#1c4a35" stroke-width="7.5" stroke-linecap="round"></path>
          <path d="M31 45 H89 L83.5 93 a8 8 0 0 1 -8 7 H43.5 a8 8 0 0 1 -8 -7 Z M47.5 74 H51.5 A2.5 2.5 0 0 1 54 76.5 V85.5 A2.5 2.5 0 0 1 51.5 88 H47.5 A2.5 2.5 0 0 1 45 85.5 V76.5 A2.5 2.5 0 0 1 47.5 74 Z M58.5 66 H62.5 A2.5 2.5 0 0 1 65 68.5 V85.5 A2.5 2.5 0 0 1 62.5 88 H58.5 A2.5 2.5 0 0 1 56 85.5 V68.5 A2.5 2.5 0 0 1 58.5 66 Z M69.5 58 H73.5 A2.5 2.5 0 0 1 76 60.5 V85.5 A2.5 2.5 0 0 1 73.5 88 H69.5 A2.5 2.5 0 0 1 67 85.5 V60.5 A2.5 2.5 0 0 1 69.5 58 Z" fill="#1c4a35" fill-rule="evenodd"></path>
        </g>
        <text x="186" y="123" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="96" letter-spacing="-3" fill="#1c4a35">Easy<tspan fill="#c39a36">Gestão</tspan></text>
      </svg>
      <h1>EasyGestão</h1>
      <p>Recuperar Acesso</p>
    </div>

    <div class="auth-info">
      Digite seu email cadastrado e enviaremos um link para redefinir sua senha. O link expira em 1 hora.
    </div>

    <form id="formReset">
      <div class="auth-campo">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
        >
      </div>

      <button type="submit" id="btnSubmit">Enviar Link de Recuperação</button>

      <div id="message" class="auth-msg"></div>
    </form>

    <div class="auth-link-back">
      <a href="/login.html">Voltar ao login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('formReset');
    const emailInput = document.getElementById('email');
    const btnSubmit = document.getElementById('btnSubmit');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      if (!email) {
        showMessage('Por favor, digite seu email', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Enviando...';
      message.textContent = '';
      message.className = 'message';

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          showMessage('Link de recuperação enviado para seu email Verifique sua caixa de entrada.', 'success');
          emailInput.value = '';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } else {
          showMessage(data.erro || data.mensagem || 'Erro ao enviar email', 'error');
        }
      } catch (err) {
        console.error(err);
        showMessage('Erro ao conectar com o servidor', 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Enviar Link de Recuperação';
      }
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }
  </script>
</body>
</html>
