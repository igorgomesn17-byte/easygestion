<DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Vendas • DS Store</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    .tabela-vendas { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .tabela-vendas thead { background: var(--surface-2); font-weight: 600; font-size: 0.9rem; }
    .tabela-vendas th, .tabela-vendas td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--surface-2); }
    .tabela-vendas tbody tr { cursor: pointer; transition: background 0.2s; }
    .tabela-vendas tbody tr:hover { background: var(--surface-2); }
    .tabela-vendas .num { text-align: center; font-weight: 600; }
    .tabela-vendas .moeda { text-align: right; font-weight: 600; color: #27ae60; }
  </style>
</head>
<body>
  <div class="conteudo">
    <div class="flex-entre">
      <div><h1>Histórico de vendas</h1><p class="subtitulo">Todas as vendas realizadas</p></div>
    </div>

    <div class="card">
      <div class="linha" style="gap:8px; flex-wrap:wrap;">
        <input type="date" id="filtroDE" onchange="carregar()">
        <input type="date" id="filtroATE" onchange="carregar()">
        <input type="search" id="busca" placeholder="🔎 Buscar por cliente..." oninput="render()">
        <button class="btn" onclick="exportar()">⬇ Exportar CSV</button>
      </div>
    </div>

    <table class="tabela-vendas" id="tabela">
      <thead>
        <tr>
          <th style="width:12%;">DATA</th>
          <th style="width:18%;">CLIENTE</th>
          <th style="width:13%;">VENDEDOR</th>
          <th style="width:13%;">PAGAMENTO</th>
          <th style="width:10%;" class="moeda">TOTAL</th>
          <th style="width:10%;" class="moeda">LUCRO</th>
          <th style="width:8%; text-align:center;">STATUS</th>
          <th style="width:4%;">›</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>

  <div class="modal-fundo" id="modalVenda">
    <div class="modal">
      <button class="modal-fechar" onclick="fecharModal()">&times;</button>
      <h2 id="vendaTitulo">Venda #123</h2>
      <div id="vendaDetalhes"></div>
    </div>
  </div>

  <script src="js/comum.js"></script>
  <script>
    montarLayout('historico');
    let dados = [];

    async function carregar() {
      const de = document.getElementById('filtroDE').value;
      const ate = document.getElementById('filtroATE').value;
      let url = '/vendas';
      if (de || ate) {
        url += '?';
        if (de) url += 'de=' + de;
        if (de && ate) url += '&';
        if (ate) url += 'ate=' + ate;
      }
      const resp = await api(url);
      dados = resp.vendas || [];
      render();
    }

    function render() {
      const b = document.getElementById('busca').value.toLowerCase();
      const arr = dados.filter(v => !b || (v.cliente_nome && v.cliente_nome.toLowerCase().includes(b)));
      const div = document.getElementById('lista');
      if (arr.length === 0) {
        div.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:32px;">Nenhuma venda encontrada.</td></tr>';
        return;
      }
      div.innerHTML = arr.map(v => `
        <tr onclick="verDetalhes(${v.id})">
          <td>${v.data_hora.slice(0,10).split('-').reverse().join('/')}<br><span class="texto-cinza" style="font-size:0.85rem;">${v.data_hora.slice(11,16)}</span></td>
          <td>${v.cliente_nome ? esc(v.cliente_nome) : '<em>não cadastrado</em>'}</td>
          <td>${v.vendedor_nome ? esc(v.vendedor_nome) : '—'}</td>
          <td>${rotuloPagamento(v.forma_pagamento)}</td>
          <td class="moeda">${moeda(v.total)}</td>
          <td class="moeda">${moeda(v.lucro)}</td>
          <td style="text-align:center;">${v.deletado ? '<span style="color:#E74C3C; font-weight:600;">Cancelada</span>' : '<span style="color:#27ae60;">✓</span>'}</td>
          <td class="num">›</td>
        </tr>`).join('');
    }

    async function verDetalhes(id) {
      const v = await api('/vendas/' + id);
      document.getElementById('vendaTitulo').textContent = `Venda #${v.id}`;

      const itens = v.itens ? v.itens.map(i => `
        <div class="linha" style="padding:8px 0; border-bottom:1px solid #EEE;">
          <div>${i.qtd}x ${esc(i.descricao)}</div>
          <strong>${moeda(i.preco_unit)}</strong>
        </div>`).join('') : '';

      document.getElementById('vendaDetalhes').innerHTML = `
        <div style="padding:0;">
          <div style="padding:12px 0; border-bottom:1px solid #EEE; margin-bottom:12px;">
            <div style="font-size:0.9rem; color:#666;">
              ${v.data_hora.slice(0,10).split('-').reverse().join('/')} às ${v.data_hora.slice(11,16)}
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;">
            <div>
              <strong style="color:#666; font-size:0.85rem;">Cliente</strong>
              <div style="margin-top:4px;">${v.cliente_nome ? esc(v.cliente_nome) : '—'}</div>
            </div>
            <div>
              <strong style="color:#666; font-size:0.85rem;">Vendedor</strong>
              <div style="margin-top:4px;">${v.vendedor_nome ? esc(v.vendedor_nome) : '—'}</div>
            </div>
            <div>
              <strong style="color:#666; font-size:0.85rem;">Canal</strong>
              <div style="margin-top:4px;">Loja física</div>
            </div>
            <div>
              <strong style="color:#666; font-size:0.85rem;">Pagamento</strong>
              <div style="margin-top:4px;">${rotuloPagamento(v.forma_pagamento)}</div>
            </div>
          </div>

          <div style="border:1px solid #EEE; border-radius:6px; padding:12px; margin-bottom:16px;">
            <strong style="display:block; margin-bottom:8px;">Itens</strong>
            <table style="width:100%; font-size:0.9rem;">
              <thead style="background:#f5f5f5;">
                <tr>
                  <th style="text-align:left; padding:6px;">PEÇA</th>
                  <th style="text-align:center; padding:6px;">QTD</th>
                  <th style="text-align:right; padding:6px;">VALOR</th>
                </tr>
              </thead>
              <tbody>
                ${v.itens ? v.itens.map(i => `
                  <tr style="border-bottom:1px solid #EEE;">
                    <td style="padding:6px;">${esc(i.descricao)}</td>
                    <td style="text-align:center; padding:6px;">${i.qtd}</td>
                    <td style="text-align:right; padding:6px;">${moeda(i.preco_unit)}</td>
                  </tr>
                `).join('') : ''}
              </tbody>
            </table>
          </div>

          <div style="border:1px solid #EEE; border-radius:6px; padding:12px; margin-bottom:16px; font-size:0.9rem;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <span>Subtotal:</span>
              <strong>${moeda(v.subtotal || v.total)}</strong>
            </div>
            ${v.taxa_aplicada > 0 ? `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>Taxa ${v.taxa_aplicada.toFixed(1)}%:</span>
                <strong style="color:#E74C3C;">-${moeda(v.valor_liquido ? (v.subtotal - v.valor_liquido) : 0)}</strong>
              </div>
            ` : ''}
            ${v.desconto > 0 ? `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>Desconto:</span>
                <strong style="color:#27ae60;">-${moeda(v.desconto)}</strong>
              </div>
            ` : ''}
            ${v.imposto > 0 ? `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>Imposto (${(v.imposto / v.total * 100).toFixed(2)}%):</span>
                <strong style="color:#E74C3C;">-${moeda(v.imposto)}</strong>
              </div>
            ` : ''}
            ${v.comissao_valor > 0 ? `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>Comissão:</span>
                <strong style="color:#E74C3C;">-${moeda(v.comissao_valor)}</strong>
              </div>
            ` : ''}
            ${v.custo_total > 0 ? `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>Custo das peças:</span>
                <strong style="color:#E74C3C;">-${moeda(v.custo_total)}</strong>
              </div>
            ` : ''}
            <div style="border-top:1px solid #EEE; padding-top:8px; display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem;">
              <span>Lucro líquido:</span>
              <strong style="color:#27ae60;">${moeda(v.lucro)}</strong>
            </div>
          </div>

          ${v.nfce ? (
            v.nfce.status === 'autorizado' ? `
              <div style="border: 2px solid #27ae60; border-radius:8px; padding:12px; margin-bottom:16px; background:#f0fdf4;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                  <span style="font-size:1.2rem; color:#27ae60;">✅</span>
                  <strong style="color:#27ae60; font-size:0.95rem;">NFC-e autorizada · ${v.nfce.ambiente}</strong>
                </div>
                <div style="font-size:0.9rem; margin-bottom:10px;">
                  <strong>Nº ${esc(v.nfce.numero)} · série ${esc(v.nfce.serie)}</strong>
                </div>
                <div style="font-size:0.85rem; color:#666; margin-bottom:12px; word-break:break-all;">
                  <strong>Chave:</strong> ${esc(v.nfce.chave || '—')}
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  ${v.nfce.caminho_danfe ? `<a class="btn btn-fino" target="_blank" href="${esc(v.nfce.caminho_danfe.startsWith('http') ? v.nfce.caminho_danfe : 'https://focusnfe.com.br' + v.nfce.caminho_danfe)}" style="background:#8a7a6d; color:white;">📄 Verificar DANFE</a>` : ''}
                  ${v.nfce.caminho_xml ? `<a class="btn btn-fino" target="_blank" href="${esc(v.nfce.caminho_xml.startsWith('http') ? v.nfce.caminho_xml : 'https://focusnfe.com.br' + v.nfce.caminho_xml)}" style="background:#333; color:white;">📋 XML</a>` : ''}
                  <button class="btn btn-fino" style="background:#c0392b; color:white;" onclick="cancelarNfce(${v.id}, ${v.nfce.id}, '${esc(v.nfce.chave)}')">✕ Cancelar nota</button>
                </div>
              </div>
            ` : (v.nfce.status === 'processando' ? `
              <div style="border: 2px solid #f39c12; border-radius:8px; padding:12px; margin-bottom:16px; background:#fef5e7;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                  <span style="font-size:1.2rem;">⏳</span>
                  <strong style="color:#f39c12; font-size:0.95rem;">NFC-e processando · ${v.nfce.ambiente}</strong>
                </div>
                <p style="margin:0; font-size:0.9rem; color:#666;">Aguardando autorização da SEFAZ...</p>
                <div style="display:flex; gap:6px; margin-top:12px;">
                  <button class="btn btn-fino" style="background:#f39c12; color:white;" onclick="consultarStatus(${v.id})">🔄 Consultar status</button>
                </div>
              </div>
            ` : `
              <div style="border: 2px solid #e74c3c; border-radius:8px; padding:12px; margin-bottom:16px; background:#fadbd8;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                  <span style="font-size:1.2rem;">❌</span>
                  <strong style="color:#e74c3c; font-size:0.95rem;">NFC-e rejeitada · ${v.nfce.ambiente}</strong>
                </div>
                <p style="margin:0; font-size:0.9rem; color:#666;">${esc(v.nfce.mensagem_sefaz || 'Erro ao emitir')}</p>
                <div style="display:flex; gap:6px; margin-top:12px;">
                  <button class="btn btn-fino" style="background:#e74c3c; color:white;" onclick="emitirNfce(${v.id})">🔄 Tentar novamente</button>
                </div>
              </div>
            `)
          ) : `
            <div style="border: 1px dashed #ddd; border-radius:8px; padding:12px; margin-bottom:16px; background:#fafafa;">
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                <span style="font-size:1.2rem;">📋</span>
                <strong style="color:#666; font-size:0.95rem;">Nota Fiscal (NFC-e) - Produção</strong>
              </div>
              <input type="text" id="cpfCliente_${v.id}" placeholder="CPF na nota (opcional)" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; margin-bottom:8px; font-size:0.9rem;">
              <button class="btn" style="background:#27ae60; color:white; width:100%;" onclick="emitirNfce(${v.id})">✓ Emitir NFC-e</button>
            </div>
          `}

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
            <button class="btn" style="background:#8a7a6d; color:white;" onclick="reimprimirCupom(${v.id})">🖨️ Reimprimir cupom</button>
            <button class="btn" style="background:#333; color:white;" onclick="abrirTroca(${v.id})">➔ Troca / devolução</button>
            <button class="btn" style="background:#c0392b; color:white;" onclick="cancelarVenda(${v.id})">❌ Cancelar venda</button>
          </div>
          <div id="botoesTraca" style="display:none; margin-top:8px;">
            <button class="btn btn-bloco" style="background:#e67e22; color:white;" onclick="removerTraca(${v.id})">🔄 Remover troca</button>
          </div>
        </div>
      `;
      document.getElementById('modalVenda').classList.add('aberto');

      // Verifica se há troca associada e mostra botão de remover
      try {
        const trocas = await api('/trocas?venda_id=' + id);
        const temTraca = trocas && trocas.length > 0;
        document.getElementById('botoesTraca').style.display = temTraca ? 'block' : 'none';
      } catch(e) {}
    }

    function fecharModal() {
      document.getElementById('modalVenda').classList.remove('aberto');
    }

    async function emitirNfce(vendaId) {
      try {
        const cpfField = document.getElementById('cpfCliente_' + vendaId);
        const cpfCliente = cpfField ? cpfField.value.trim() : '';
        const r = await api('/nfce/emitir/' + vendaId, { method:'POST', body:{ cpf_cliente: cpfCliente } });
        toast('NFC-e emitida com sucesso','sucesso');
        // Recarrega detalhes pra mostrar a NFC-e
        setTimeout(() => verDetalhes(vendaId), 1000);
      } catch(e) { toast(e.message,'erro'); }
    }

    async function consultarStatus(vendaId) {
      try {
        await api('/nfce/status/' + vendaId);
        toast('Status consultado com Focus. Recarregando...', 'sucesso');
        setTimeout(() => verDetalhes(vendaId), 1500);
      } catch(e) {
        toast(e.message, 'erro');
      }
    }

    async function cancelarNfce(vendaId, notaId, chave) {
      const justificativa = prompt('Motivo do cancelamento (mínimo 15 caracteres):\n\n(Ex: "Nota emitida com erro")');
      if (!justificativa || justificativa.trim().length < 15) {
        toast('Justificativa deve ter pelo menos 15 caracteres', 'erro');
        return;
      }
      try {
        await api('/nfce/cancelar/' + vendaId, {
          method: 'DELETE',
          body: { justificativa: justificativa.trim() }
        });
        toast('NFC-e cancelada com sucesso', 'sucesso');
        setTimeout(() => verDetalhes(vendaId), 1000);
      } catch(e) {
        toast(e.message, 'erro');
      }
    }

    function reimprimirCupom(vendaId) {
      fecharModal();
      window.location.href = 'cupom.html?venda=' + vendaId;
    }

    function abrirTroca(vendaId) {
      fecharModal();
      window.location.href = 'trocas.html?venda=' + vendaId;
    }

    async function cancelarVenda(vendaId) {
      if (!confirm('⚠️ Cancelar esta venda? O estoque será devolvido e o caixa será atualizado.')) return;
      try {
        await api('/vendas/' + vendaId, { method: 'DELETE' });
        toast('Venda cancelada com sucesso', 'sucesso');
        fecharModal();
        carregar();
      } catch(e) { toast(e.message, 'erro'); }
    }

    async function removerTraca(vendaId) {
      if (!confirm('⚠️ Remover a troca? A venda voltará ao normal sem troca.')) return;
      try {
        const trocas = await api('/trocas?venda_id=' + vendaId);
        if (trocas && trocas.length > 0) {
          await api('/trocas/' + trocas[0].id, { method: 'DELETE' });
          toast('Troca removida com sucesso', 'sucesso');
          fecharModal();
          carregar();
        }
      } catch(e) { toast(e.message, 'erro'); }
    }

    function exportar() {
      if (!dados.length) { toast('Nada para exportar','erro'); return; }
      const linhas = dados.map(v => ({
        ID: v.id, Cliente: v.cliente_nome||'', Data: v.data_hora.slice(0,10),
        Hora: v.data_hora.slice(11,16), Pagamento: v.forma_pagamento,
        Subtotal: v.subtotal||v.total, Desconto: v.desconto||0, Total: v.total, Lucro: v.lucro
      }));
      exportarCSV('historico-vendas-' + hojeLocalStr(), linhas);
    }

    document.getElementById('modalVenda').addEventListener('click', e => { if(e.target.id==='modalVenda') fecharModal(); });
    carregar();
  </script>
</body>
</html>
