<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação 2FA — EasyGestão Admin</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.3);
      max-width: 420px; width: 100%; padding: 38px 30px; text-align: center; }
    .logo { margin-bottom: 28px; font-size: 48px; }
    h1 { color: var(--marca); margin-bottom: 8px; font-size: 24px; font-weight: 700; }
    .subtitle { color: var(--tinta-2); font-size: 14px; margin-bottom: 28px; }
    .auth-campo { margin-bottom: 18px; text-align: left; }
    .auth-campo label { display: block; font-size: .82rem; font-weight: 500; color: var(--tinta-2);
      margin: 12px 0 5px; }
    .auth-campo input { width: 100%; min-height: 46px; padding: 12px 14px; border: 1px solid var(--linha);
      border-radius: var(--radius-sm); font-size: 18px; font-family: monospace; text-align: center;
      transition: border-color .2s; letter-spacing: 0.5em; }
    .auth-campo input:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px rgba(26,111,94,.15); }
    .auth-btn { width: 100%; min-height: 48px; margin-top: 18px; border: none; border-radius: var(--radius-sm);
      background: var(--marca); color: #fff; font-family: inherit; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: background .2s, transform .2s; }
    .auth-btn:hover:not(:disabled) { background: var(--marca-escura); transform: translateY(-2px); }
    .auth-btn:disabled { opacity: .6; cursor: wait; }
    .auth-msg { margin-top: 15px; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; display: none; }
    .auth-msg.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; }
    .auth-msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; display: block; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--tinta-3); }
    .auth-footer a { color: var(--marca); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .info-box { background: var(--surface-alt); padding: 15px; border-radius: var(--radius-sm);
      border-left: 4px solid var(--marca); margin-bottom: 20px; font-size: 13px; color: var(--tinta-2); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo">🔐</div>
    <h1>Verificação 2FA</h1>
    <p class="subtitle">Digite o código do seu autenticador</p>

    <div class="info-box">
      Digite o código de 6 dígitos do Google Authenticator, Authy ou Microsoft Authenticator
    </div>

    <form id="form2fa">
      <div class="auth-campo">
        <label for="token">Código 2FA (6 dígitos)</label>
        <input
          type="text"
          id="token"
          name="token"
          placeholder="000000"
          maxlength="6"
          inputmode="numeric"
          pattern="\d{6}"
          required
          autocomplete="one-time-code"
        >
      </div>

      <button type="submit" class="auth-btn" id="btnEnviar">
        ✓ Verificar
      </button>
      <div id="mensagem" class="auth-msg"></div>
    </form>

    <div class="auth-footer" style="margin-top: 30px;">
      <p>Não consegue acessar seu autenticador?</p>
      <p style="margin-top: 5px; color: #999; font-size: 12px;">Entre em contato com o suporte</p>
    </div>
  </div>

  <script>
    function mostrarMensagem(texto, tipo) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      el.className = `auth-msg ${tipo}`;
    }

    // Auto-submit quando digita 6 dígitos
    document.getElementById('token').addEventListener('input', (e) => {
      if (e.target.value.length === 6) {
        // pequeno delay para UX
        setTimeout(() => {
          document.getElementById('form2fa').dispatchEvent(new Event('submit'));
        }, 100);
      }
    });

    document.getElementById('form2fa').addEventListener('submit', async (e) => {
      e.preventDefault();

      const token = document.getElementById('token').value.trim();
      if (!/^\d{6}$/.test(token)) {
        mostrarMensagem('Código deve ter 6 dígitos', 'error');
        return;
      }

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const resp = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senha: sessionStorage.getItem('__admin_senha_temp') || '',
            token_2fa: token
          })
        });

        const data = await resp.json();

        if (resp.ok && data.ok) {
          mostrarMensagem('✓ Autenticado com sucesso!', 'success');
          sessionStorage.removeItem('__admin_senha_temp');
          setTimeout(() => {
            window.location.href = data.destino || '/admin.html';
          }, 500);
        } else if (resp.status === 401) {
          mostrarMensagem('Código inválido. Tente novamente.', 'error');
          document.getElementById('token').value = '';
          document.getElementById('token').focus();
        } else {
          mostrarMensagem(data.erro || 'Erro na verificação', 'error');
        }
      } catch (err) {
        mostrarMensagem('Erro ao conectar: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '✓ Verificar';
      }
    });

    // Focus no campo ao carregar
    window.addEventListener('load', () => {
      document.getElementById('token').focus();
    });
  </script>
</body>
</html>
