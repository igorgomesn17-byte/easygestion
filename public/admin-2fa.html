<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação 2FA — EasyGestão Admin</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--marca) 0%, var(--marca-escura) 100%); padding: 20px; }
    .auth-card { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 400px; width: 100%; padding: 40px; }
    .etapa-badge { display: inline-block; background: var(--marca); color: white; font-size: 11px;
      font-weight: 700; padding: 4px 10px; border-radius: 4px; margin-bottom: 20px; }
    .logo { text-align: center; margin-bottom: 20px; font-size: 32px; }
    h1 { color: var(--marca); margin-bottom: 8px; font-size: 22px; font-weight: 700; text-align: center; }
    .subtitle { color: #999; font-size: 13px; margin-bottom: 20px; text-align: center; }
    .auth-campo { margin-bottom: 16px; }
    .auth-campo label { display: block; font-size: 11px; font-weight: 600; color: var(--marca);
      margin-bottom: 6px; text-transform: uppercase; }
    .auth-campo input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 14px; font-family: monospace; text-align: center; letter-spacing: 0.1em; }
    .auth-campo input:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px rgba(26, 111, 94, 0.1); }
    .toggle-group { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px;
      background: #f5f5f5; border-radius: 6px; }
    .toggle-group input[type="radio"] { cursor: pointer; }
    .toggle-group label { cursor: pointer; font-size: 12px; margin: 0; }
    .auth-btn { width: 100%; padding: 12px; background: var(--marca); color: white; border: none;
      border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .auth-btn:hover:not(:disabled) { background: var(--marca-escura); }
    .auth-btn:disabled { opacity: 0.6; cursor: wait; }
    .auth-msg { padding: 10px; border-radius: 4px; font-size: 12px; margin-bottom: 15px; display: none; }
    .auth-msg.error { background: #ffebee; color: var(--vermelho); border: 1px solid #f44336; }
    .auth-msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; }
    .auth-msg.show { display: block; }
    .info-box { background: #f0f7ff; padding: 10px; border-radius: 6px; border-left: 3px solid #2196f3;
      margin-bottom: 16px; font-size: 12px; color: #333; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="etapa-badge">Etapa 2 de 2 — Verificação 2FA</div>

    <div class="logo"></div>
    <h1>Insira seu Código</h1>

    <div id="mensagem" class="auth-msg"></div>

    <div class="info-box">
      Digite o código de 6 dígitos do seu autenticador (Google Authenticator, Authy, Microsoft Authenticator)
    </div>

    <form id="form2fa">
      <div class="toggle-group">
        <input type="radio" id="tipo-token" name="tipo" value="token" checked>
        <label for="tipo-token">Código do autenticador</label>
      </div>

      <div class="toggle-group">
        <input type="radio" id="tipo-backup" name="tipo" value="backup">
        <label for="tipo-backup">Código de backup</label>
      </div>

      <div class="auth-campo">
        <label for="codigo" id="label-codigo">Código 2FA (6 dígitos)</label>
        <input
          type="text"
          id="codigo"
          placeholder="000000"
          maxlength="6"
          inputmode="numeric"
          pattern="\d{6}"
          required
        >
      </div>

      <button type="submit" class="auth-btn" id="btnEnviar">
        Verificar
      </button>
    </form>
  </div>

  <script>
    const formEl = document.getElementById('form2fa');
    const codigoInput = document.getElementById('codigo');
    const btnEnviar = document.getElementById('btnEnviar');
    const mensagemEl = document.getElementById('mensagem');
    const labelCodigoEl = document.getElementById('label-codigo');
    const tipoTokenEl = document.getElementById('tipo-token');
    const tipoBackupEl = document.getElementById('tipo-backup');

    // Toggle entre token (6 dígitos) e backup code (8 caracteres)
    document.querySelectorAll('input[name="tipo"]').forEach(radio => {
      radio.addEventListener('change', () => {
        if (tipoBackupEl.checked) {
          codigoInput.maxLength = 8;
          codigoInput.pattern = '[A-Z0-9]{8}';
          codigoInput.placeholder = 'ABCD1234';
          codigoInput.inputMode = 'text';
          labelCodigoEl.textContent = 'Código de backup (8 caracteres)';
        } else {
          codigoInput.maxLength = 6;
          codigoInput.pattern = '\\d{6}';
          codigoInput.placeholder = '000000';
          codigoInput.inputMode = 'numeric';
          labelCodigoEl.textContent = 'Código 2FA (6 dígitos)';
        }
        codigoInput.value = '';
        mensagemEl.classList.remove('show');
        codigoInput.focus();
      });
    });

    function mostrarMensagem(texto, tipo) {
      mensagemEl.textContent = texto;
      mensagemEl.className = `auth-msg ${tipo} show`;
    }

    // Auto-submit quando completa o código
    codigoInput.addEventListener('input', (e) => {
      const valor = e.target.value;
      const completo = tipoBackupEl.checked ? valor.length === 8 : valor.length === 6;
      if (completo) {
        setTimeout(() => {
          formEl.dispatchEvent(new Event('submit'));
        }, 100);
      }
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();

      const codigo = codigoInput.value.trim();
      const usarBackup = tipoBackupEl.checked;

      if (usarBackup) {
        if (!/^[A-Z0-9]{8}$/.test(codigo)) {
          mostrarMensagem('Código de backup deve ter 8 caracteres', 'error');
          return;
        }
      } else {
        if (!/^\d{6}$/.test(codigo)) {
          mostrarMensagem('Código deve ter 6 dígitos', 'error');
          return;
        }
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Verificando...';

      try {
        const payload = usarBackup ? { backup_code: codigo } : { token: codigo };

        const resp = await fetch('/api/admin/2fa-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (resp.ok && data.ok) {
          mostrarMensagem('Autenticado com sucesso!', 'success');
          setTimeout(() => {
            window.location.href = data.destino || '/admin-dashboard.html';
          }, 1000);
        } else if (resp.status === 401) {
          mostrarMensagem(data.erro || 'Código inválido. Tente novamente.', 'error');
          codigoInput.value = '';
          codigoInput.focus();
        } else if (resp.status === 429) {
          mostrarMensagem(data.erro || 'Muitas tentativas. Tente novamente em 15 minutos.', 'error');
        } else {
          mostrarMensagem(data.erro || 'Erro na verificação', 'error');
        }
      } catch (err) {
        mostrarMensagem('Erro de conexão: ' + err.message, 'error');
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = 'Verificar';
      }
    });

    window.addEventListener('load', () => {
      codigoInput.focus();
    });
  </script>
</body>
</html>
