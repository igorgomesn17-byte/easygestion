<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configure sua Loja • EasyGestão</title>
  <link rel="stylesheet" href="css/ds.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--marca) 0%, var(--marca-escura) 100%);
      padding: 20px;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      max-width: 900px;
      width: 100%;
    }
    .card-form {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(0,0,0,.3);
      padding: 38px;
    }
    .card-preview {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(0,0,0,.3);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 { font-size: 24px; margin-bottom: 6px; color: var(--marca); font-weight: 700; }
    .subtitulo { color: var(--tinta-2); font-size: 14px; margin-bottom: 28px; }
    .campo { margin-bottom: 22px; }
    .campo label { display: block; text-align: left; font-size: 13px; font-weight: 500; color: var(--tinta-2); margin-bottom: 8px; }
    .campo input, .campo select { width: 100%; padding: 12px 14px; border: 1px solid var(--linha); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; }
    .campo input:focus, .campo select:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px rgba(26,111,94,.15); }
    .color-swatches { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all .2s; }
    .swatch:hover { transform: scale(1.1); }
    .swatch.ativo { border-color: var(--tinta); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--marca); }
    .color-picker-wrapper { display: flex; gap: 10px; align-items: center; }
    .color-picker-wrapper input[type="color"] { width: 60px; height: 40px; border: 1px solid var(--linha); border-radius: var(--radius-sm); cursor: pointer; }
    .color-preview { width: 60px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--linha); background: var(--marca); }
    .file-input-wrapper { display: flex; align-items: center; gap: 10px; }
    .file-input-wrapper input[type="file"] { display: none; }
    .btn-upload { padding: 10px 16px; font-size: 13px; cursor: pointer; }
    .logo-preview { width: 100px; height: 100px; border: 1px solid var(--linha); border-radius: var(--radius-sm); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--tinta-3); overflow: hidden; }
    .logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .buttons { display: flex; gap: 12px; margin-top: 28px; }
    .btn { flex: 1; }
    .btn-bloco { width: 100%; }
    .rodape { text-align: center; margin-top: 20px; font-size: 13px; color: var(--tinta-2); }
    .rodape a { color: var(--marca); text-decoration: none; font-weight: 500; }
    .rodape a:hover { text-decoration: underline; }
    .preview-box { text-align: center; }
    .preview-topbar { width: 100%; height: 50px; background: var(--marca); border-radius: var(--radius-sm) var(--radius-sm) 0 0; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px; margin-bottom: 20px; }
    .preview-content { text-align: left; padding: 0; }
    .preview-logo { width: 80px; height: 80px; background: var(--bg); border: 1px solid var(--linha); border-radius: var(--radius-sm); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .preview-nome { font-weight: 600; color: var(--tinta); font-size: 16px; margin-bottom: 8px; }
    .preview-label { font-size: 12px; color: var(--tinta-2); margin-top: 20px; margin-bottom: 6px; font-weight: 500; }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; gap: 20px; }
      .card-form { padding: 24px; }
      .card-preview { display: none; }
    }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #btnContinuar:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-form">
      <h1>Personalize sua loja</h1>
      <p class="subtitulo">Configure o nome, cor e logo que seus clientes verão</p>

      <form id="formOnboarding">
        <div class="campo">
          <label>Nome da Loja *</label>
          <input type="text" id="loja_nome" placeholder="Ex: DS Store, Boutique Maria..." required autofocus>
        </div>

        <div class="campo">
          <label>Cor da Marca</label>
          <div class="color-swatches" id="colorSwatches"></div>
          <div class="color-picker-wrapper">
            <input type="color" id="marca_cor" value="#1a6f5e">
            <div class="color-preview"></div>
          </div>
        </div>

        <div class="campo">
          <label>Logo (opcional)</label>
          <div class="file-input-wrapper">
            <input type="file" id="loja_logo" accept="image/png,image/jpeg,image/webp">
            <button type="button" class="btn btn-fino" onclick="document.getElementById('loja_logo').click()">Escolher arquivo</button>
          </div>
          <div id="logoPreview" class="logo-preview" style="margin-top: 10px; display: none;"></div>
          <p style="font-size: 12px; color: var(--tinta-3); margin-top: 6px;">PNG, JPG ou WEBP • Máximo 2MB</p>
        </div>

        <div class="buttons">
          <button type="button" class="btn btn-fantasma" onclick="pularOnboarding()">Pular por agora</button>
          <button type="submit" id="btnContinuar" class="btn">Continuar →</button>
        </div>
      </form>

      <div class="rodape">
        Seu primeiro produto e configuração financeira virão depois, <a href="#" onclick="window.location.href='index.html'; return false;">ir para dashboard</a>
      </div>
    </div>

    <div class="card-preview">
      <div class="preview-box">
        <div class="preview-topbar" id="previewTopbar">Sua Loja</div>
        <div class="preview-logo" id="previewLogo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width:60px; height:60px; fill:var(--tinta-3);">
            <path d="M20 20 h60 v60 h-60 z M35 40 l15 20 l15 -20 M45 70 v-15"/>
          </svg>
        </div>
        <div class="preview-nome" id="previewNome">Sua Loja</div>
        <div class="preview-label">É assim que aparecerá para seus clientes</div>
      </div>
    </div>
  </div>

  <script>
    const formOnboarding = document.getElementById('formOnboarding');
    const inputNome = document.getElementById('loja_nome');
    const inputCor = document.getElementById('marca_cor');
    const inputLogo = document.getElementById('loja_logo');
    const colorSwatchesContainer = document.getElementById('colorSwatches');
    const previewTopbar = document.getElementById('previewTopbar');
    const previewNome = document.getElementById('previewNome');
    const previewLogo = document.getElementById('previewLogo');
    const previewColorInput = document.querySelector('.color-preview');
    const logoPreview = document.getElementById('logoPreview');
    const btnContinuar = document.getElementById('btnContinuar');

    const COLORS = ['#1a6f5e', '#1e4c3e', '#8b3a3a', '#2d5a6f', '#5a4a8f', '#d4a574'];

    // Renderizar color swatches
    COLORS.forEach(color => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.backgroundColor = color;
      swatch.onclick = () => {
        inputCor.value = color;
        updatePreview();
      };
      colorSwatchesContainer.appendChild(swatch);
    });

    // Event listeners
    inputNome.addEventListener('input', updatePreview);
    inputCor.addEventListener('input', updatePreview);
    inputLogo.addEventListener('change', handleLogoUpload);

    function updatePreview() {
      const nome = inputNome.value || 'Sua Loja';
      const cor = inputCor.value || '#1a6f5e';

      previewNome.textContent = nome;
      previewTopbar.textContent = nome;
      previewTopbar.style.backgroundColor = cor;
      previewColorInput.style.backgroundColor = cor;
      document.documentElement.style.setProperty('--marca', cor);

      // Atualizar swatches ativo
      document.querySelectorAll('.swatch').forEach(swatch => {
        swatch.classList.toggle('ativo', swatch.style.backgroundColor === cor);
      });
    }

    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        alert('Arquivo muito grande. Máximo 2MB.');
        inputLogo.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const dataUrl = event.target.result;
        const img = document.createElement('img');
        img.src = dataUrl;
        img.onload = () => {
          previewLogo.innerHTML = '';
          const imgClone = img.cloneNode(true);
          previewLogo.appendChild(imgClone);
          logoPreview.innerHTML = '';
          const imgClone2 = img.cloneNode(true);
          logoPreview.appendChild(imgClone2);
          logoPreview.style.display = 'flex';
          // Guardar dataUrl em memória para enviar depois
          window._logoDataUrl = dataUrl;
        };
      };
      reader.readAsDataURL(file);
    }

    async function pularOnboarding() {
      try {
        await fetch('/api/onboarding/estado', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pulado: true, banner_dispensado: true }),
          credentials: 'same-origin'
        });
        window.location.href = 'index.html';
      } catch (e) {
        console.error('Erro ao pular onboarding:', e);
        window.location.href = 'index.html';
      }
    }

    formOnboarding.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnContinuar.disabled = true;
      btnContinuar.innerHTML = '<span class="spinner"></span>Salvando...';

      try {
        const nome = inputNome.value.trim();
        const cor = inputCor.value.trim();

        if (!nome) {
          alert('Nome da loja é obrigatório');
          btnContinuar.disabled = false;
          btnContinuar.innerHTML = 'Continuar →';
          return;
        }

        // 1. Salvar identidade em config + LIGAR a vitrine (vitrine_ativa=1).
        // Sem isso, o GET /api/vitrine/:slug barra no gate e a loja não aparece
        // até o cliente re-salvar a seção Vitrine no config. (O gate de PLANO —
        // vitrine só no Growth — continua valendo à parte; isto é só o "publicar".)
        const configResp = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loja_nome: nome, marca_cor: cor, vitrine_ativa: '1' }),
          credentials: 'same-origin'
        });
        if (!configResp.ok) throw new Error('Erro ao salvar identidade');

        // 2. Se houver logo, fazer upload (bloqueante)
        if (window._logoDataUrl) {
          const logoResp = await fetch('/api/config/logo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ logo: window._logoDataUrl }),
            credentials: 'same-origin'
          });
          if (!logoResp.ok) throw new Error('Erro ao salvar logo');
        }

        // 3. Atualizar estado do onboarding
        const estadoResp = await fetch('/api/onboarding/estado', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ etapa: 'produto' }),
          credentials: 'same-origin'
        });
        if (!estadoResp.ok) throw new Error('Erro ao atualizar estado');

        // 4. Redirecionar para produtos.html?tour=1
        window.location.href = 'produtos.html?tour=1';
      } catch (err) {
        console.error('Erro no onboarding:', err);
        alert('Erro ao salvar. Tente novamente.');
        btnContinuar.disabled = false;
        btnContinuar.innerHTML = 'Continuar →';
      }
    });

    // Inicializar preview
    updatePreview();
  </script>
</body>
</html>
